# Builds the Windows installers WITHOUT publishing anything, to catch Rust/Tauri build
# errors before a real release. Uses a throwaway signing key, so the produced installers
# can be installed and tested but their updater signatures are meaningless. Trigger it
# manually from the Actions tab, or push changes under src-tauri.
#
# Builds both 64-bit (x64) and 32-bit (x86) Windows. The 32-bit build is for older
# computers running 32-bit Windows 10; Windows 7/8 are not supported (no WebView2).
name: Bygg-kontroll (Windows)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/build-check.yml'

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg installer ${{ matrix.arch }} (utan publicering)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      # One architecture failing should not cancel the other: we want to see both results.
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installera Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cacha Rust-bygget
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Installera beroenden
        run: pnpm install --frozen-lockfile

      - name: Kontrollera och bygg innehållet
        run: |
          pnpm content:check
          pnpm content:build

      - name: Tillfällig signeringsnyckel (bara för den här kontrollen)
        run: pnpm --filter desktop exec tauri signer generate -w "$RUNNER_TEMP/check.key" --ci

      - name: Bygg installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/check.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm --filter desktop exec tauri build --target ${{ matrix.target }} --bundles nsis --ci

      - name: Lista resultatet
        run: ls -la apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/

      - name: Ladda upp installern som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: bygglov-studieapp-windows-${{ matrix.arch }}-installer
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
