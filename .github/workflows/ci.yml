# Fast checks on every push and pull request. No Tauri compilation here: that only happens
# in release.yml on tags (it takes 10-20 min on the Windows runner). The study assistant's
# API client (crates/tutor-client) has no Tauri dependency, so its tests run here.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, innehåll och bygge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installera beroenden
        run: pnpm install --frozen-lockfile

      - name: Versionen är synkad
        run: pnpm version:check

      - name: Lint
        run: pnpm lint

      - name: Formatering (Prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Kontrollera innehållet
        run: pnpm content:check

      - name: Bygg innehållet
        run: pnpm content:build

      - name: Vite-bygge av desktop
        run: pnpm --filter desktop build

      - name: Rust-test av studiehjälpens API-klient
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked -p tutor-client
