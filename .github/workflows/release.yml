# Builds the Windows installer and publishes a GitHub Release when a tag v* is pushed.
# The release is published (not a draft), so releases/latest/download/latest.json,
# which the in-app updater polls, points at it immediately. See docs/release-checklista.md.
name: Release

on:
  push:
    tags: ['v*']
  # Manual start: tags v<version from package.json> at the current commit and releases it.
  # Used when the tag cannot be pushed from where the work is done (e.g. a cloud session).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bygg och publicera (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installera Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cacha Rust-bygget
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Installera beroenden
        run: pnpm install --frozen-lockfile

      - name: Bestäm tagg
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$version"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release-tagg: $tag"

      - name: Kontrollera tagg, version och signeringsnyckel
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          pnpm version:check
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Taggen $TAG matchar inte versionen $version i package.json. Kör pnpm version:sync och tagga v$version."
            exit 1
          fi
          pubkey="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          if [ -z "$pubkey" ]; then
            echo "::error::plugins.updater.pubkey i tauri.conf.json är tom. Klistra in den publika nyckeln (se docs/release-checklista.md)."
            exit 1
          fi

      - name: Skapa taggen om den saknas (manuell start)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)"
            [ -z "$remote_sha" ] && remote_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)"
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Taggen $TAG finns redan och pekar på $remote_sha, inte på $GITHUB_SHA. Höj versionen i package.json (pnpm version:sync) och försök igen."
              exit 1
            fi
            echo "Taggen $TAG finns redan på rätt commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Bygglov-studieapp $TAG"
            git push origin "refs/tags/$TAG"
            echo "Skapade taggen $TAG på $GITHUB_SHA."
          fi

      - name: Test
        run: pnpm test

      - name: Kontrollera och bygg innehållet
        run: |
          pnpm content:check
          pnpm content:build

      - name: Hämta release notes ur CHANGELOG.md
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node .github/scripts/changelog-section.mjs "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            cat "$RUNNER_TEMP/release-notes.md"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Bygg installer och publicera release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: Bygglov-studieapp v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
