[package]
name = "tutor-client"
version = "0.1.0"
description = "Streaming client for the Anthropic Messages API used by the study assistant (no Tauri dependency)"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
