[package]
name = "bygglov-studieapp"
version = "0.6.1"
description = "Studieapp för blivande bygglovshandläggare"
authors = ["Bygglov-studieapp"]
license = "MIT"
repository = "https://github.com/sockulags/Bygglov-studieapp"
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["crates/tutor-client"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "bygglov_studieapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-http = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Study assistant: the Messages API client (no Tauri dependency, tested on its own) and the
# OS credential store for the API key. windows-native = Windows Credential Manager (the
# shipped target); apple-native/linux-native only make other platforms store the key for
# real instead of keyring's in-memory mock.
tutor-client = { path = "crates/tutor-client" }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "linux-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
