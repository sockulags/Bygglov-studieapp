  - id: hand-040
    typ: ordning
    svarighet: 3
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      Ordna stegen fram till att ett bygglov får laga kraft mot en granne som inte ska delges,
      om ingen överklagar.
    poster:
      - Nämnden beslutar om bygglov.
      - Beslutet kungörs på kommunens anslagstavla och meddelande skickas till grannen samma dag.
      - En vecka passerar efter kungörelsen.
      - Treveckorsfristen för överklagande börjar löpa.
      - Fristen löper ut utan att någon har överklagat.
    forklaring: >
      För den som inte ska delges räknas överklagandetiden från den dag som infaller en vecka
      efter kungörelsen (13 kap. 16 § PBL). Själva överklagandetiden är tre veckor (44 § FL).
      Lovet gäller redan från beslutet (9 kap. 114 §), men giltighetstiden i 115 § räknas från
      laga kraft.
    lagrum:
      - PBL 9 kap. 109 §
      - PBL 9 kap. 110 §
      - PBL 13 kap. 16 §
      - FL 44 §
    taggar: [laga_kraft, overklagande, ordning]

  # --- Före 1 december 2025 och nu -------------------------------------------------------

  - id: hand-041
    typ: flerval
    svarighet: 1
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      En erfaren kollega säger: "Klockan för de tio veckorna startar när ansökan är komplett."
      Stämmer det i dag?
    alternativ:
      - text: Ja, så har det alltid varit.
      - text: Nej, fristen räknas från ansökningsdagen. Bara ett föreläggande inom tre veckor flyttar startpunkten.
        ratt: true
      - text: Nej, fristen räknas från den dag ansökan registreras i diariet.
      - text: Nej, det finns ingen frist längre.
    forklaring: >
      Före 1 december 2025 räknades fristen från den dag ansökan var komplett. Nu räknas den från
      ansökningsdagen (9 kap. 99 § 1 PBL). Startpunkten flyttas bara om sökanden själv lämnar in
      nytt underlag, om Försvarsmakten eller MCF lämnar besked, eller om nämnden förelagt om
      komplettering inom tre veckor (99 § 2–4). Det gör tidig fullständighetsgranskning
      avgörande.
    lagrum:
      - PBL 9 kap. 99 §
    taggar: [fore_och_nu, handlaggningstid, treveckorsregeln]

  - id: hand-042
    typ: sant_falskt
    svarighet: 1
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      Ett bygglov får fortfarande börja användas först fyra veckor efter att beslutet kungjorts i
      Post- och Inrikes Tidningar.
    svar: false
    forklaring: >
      Båda delarna är gamla regler. Före 1 december 2025 kungjordes lovbeslut i Post- och Inrikes
      Tidningar och lovet fick verkställas tidigast fyra veckor efter kungörelsen. Nu kungörs
      beslutet på kommunens anslagstavla (9 kap. 109 § PBL) och lovet gäller omedelbart
      (114 §). Startbesked krävs fortfarande innan arbetet börjar.
    lagrum:
      - PBL 9 kap. 109 §
      - PBL 9 kap. 114 §
    taggar: [fore_och_nu, kungorelse, lov_galler]

  - id: hand-043
    typ: flerval
    svarighet: 2
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      I en äldre mall för underrättelse står att meddelandet ska skickas till "ägare, hyresgäster
      och bostadsrättshavare" i grannfastigheterna. Vad gäller nu?
    alternativ:
      - text: Mallen stämmer fortfarande.
      - text: Meddelandet ska skickas till ägare och innehavare av särskild rätt, inte till hyresgäster och bostadsrättshavare, och kungöras på anslagstavlan.
        ratt: true
      - text: Meddelandet ska bara kungöras på anslagstavlan och inte skickas till någon.
      - text: Meddelandet ska bara skickas till hyresgäster och bostadsrättshavare, eftersom ägaren delges beslutet.
    forklaring: >
      Kretsen som får underrättelsen under handläggningen har ändrats. Enligt 9 kap. 96 § PBL
      skickas meddelandet till ägaren eller innehavaren av en särskild rätt till gränsande
      fastigheter och kungörs på kommunens anslagstavla. Hyresgäster och bostadsrättshavare
      ingår inte längre. Uppdatera mallarna när du hittar sådana rester av gamla regler.
    lagrum:
      - PBL 9 kap. 96 §
    taggar: [fore_och_nu, grannar, underrattelse]

  # --- Instudering -----------------------------------------------------------------------

  - id: hand-044
    typ: oppen
    svarighet: 2
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      En ansökan om tillbyggnad kom in för fem dagar sedan. Det saknas fasadritningar och
      uppgift om kontrollansvarig. Beskriv vad ett föreläggande om komplettering ska innehålla
      och varför det är viktigt att det skickas snart.
    bedomningspunkter:
      - Anger konkret vilka handlingar och uppgifter som saknas.
      - Anger en bestämd tid för kompletteringen.
      - Upplyser om att ansökan kan avvisas eller att ärendet kan avgöras i befintligt skick om föreläggandet inte följs (9 kap. 91 § PBL).
      - Förklarar treveckorsregeln, att fristen räknas från dagen bristen avhjälps bara om föreläggandet skickas inom tre veckor (99 § 4).
      - Nämner att sökanden skriftligen ska informeras om den ändrade tidpunkten för fristen (100 § 2).
      - Nämner serviceskyldigheten, t.ex. att ringa sökanden och förklara (6 och 20 §§ FL).
    modellsvar: >
      Föreläggandet ska ange exakt vad som saknas, här fasadritningar i skala och uppgift om
      kontrollansvarig med certifiering, och ett datum då kompletteringen senast ska ha kommit in.
      Det ska upplysa om att ansökan kan avvisas eller att ärendet kan avgöras i befintligt skick
      om föreläggandet inte följs (9 kap. 91 § PBL). Det är viktigt att det skickas inom tre veckor
      från ansökningsdagen, eftersom tioveckorsfristen då räknas från den dag kompletteringen
      kommer in (99 § 4). Annars löper fristen från ansökningsdagen och avgiften kan reduceras.
      När kompletteringen kommit in informerar jag sökanden skriftligen om den nya
      startpunkten (100 § 2). Jag ringer också gärna sökanden och förklarar vad som behövs.
    lagrum:
      - PBL 9 kap. 91 §
      - PBL 9 kap. 99 §
      - PBL 9 kap. 100 §
      - FL 6 §
    taggar: [komplettering, forelaggande, treveckorsregeln]

  - id: hand-045
    typ: oppen
    svarighet: 3
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      Beskriv hela gången för grannehörande i ett ärende där en villa inom detaljplan avviker
      från planen, från att ansökan är komplett till att beslutet fått laga kraft.
    bedomningspunkter:
      - Underrättelse krävs vid planavvikelse (9 kap. 94 § PBL).
      - Meddelandets innehåll och mottagare, ägare och innehavare av särskild rätt till gränsande fastigheter, inte hyresgäster (95–96 §§).
      - Meddelandet kungörs också på kommunens anslagstavla (96 § 2).
      - Inkomna synpunkter kommuniceras med sökanden och fastighetsägaren före beslut (98 §).
      - Grannar vars synpunkter inte tillgodosetts delges beslutet (108 §).
      - Beslutet kungörs på anslagstavlan och meddelande skickas till övriga grannar senast samma dag (109–110 §§).
      - Överklagandetid tre veckor, för icke delgivna från en vecka efter kungörelsen (13 kap. 16 § PBL, 44 § FL).
    modellsvar: >
      Eftersom villan avviker från planen ska nämnden underrätta grannarna (9 kap. 94 § PBL). Ett
      meddelande med ansökans huvudsakliga innehåll, var den finns tillgänglig och hur, till vem
      och när synpunkter ska lämnas skickas till ägare och innehavare av särskild rätt till
      fastigheter som gränsar till tomten eller bara skiljs från den av en gata (95–96 §§).
      Meddelandet kungörs också på kommunens anslagstavla. Synpunkter som kommer in är underlag
      som ska kommuniceras med sökanden och fastighetsägaren innan beslut (98 §). Ges lov delges
      beslutet sökanden, fastighetsägaren och de grannar vars synpunkter inte tillgodosetts
      (108 §). Beslutet kungörs på anslagstavlan och meddelandet skickas samma dag till övriga
      grannar (109–110 §§). Den som delges har tre veckor från delgivningen på sig att överklaga,
      övriga tre veckor räknat från en vecka efter kungörelsen (13 kap. 16 § PBL, 44 § FL). När
      ingen tid längre löper och ingen överklagat har beslutet fått laga kraft.
    lagrum:
      - PBL 9 kap. 94 §
      - PBL 9 kap. 96 §
      - PBL 9 kap. 98 §
      - PBL 9 kap. 108 §
      - PBL 9 kap. 109 §
      - PBL 9 kap. 110 §
      - PBL 13 kap. 16 §
    taggar: [grannar, underrattelse, laga_kraft]

  - id: hand-046
    typ: oppen
    svarighet: 3
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      Skriv en motivering till ett avslagsbeslut för en tillbyggnad som till största delen hamnar
      på prickmark. Ange vad beslutet i övrigt måste innehålla och hur det ska expedieras.
    bedomningspunkter:
      - Anger tillämpliga föreskrifter, t.ex. 9 kap. 56 § första stycket 2 och 60 § PBL (32 § FL).
      - Beskriver konkret omständigheterna, hur stor del som hamnar på prickmark och varför avvikelsen inte är liten.
      - Bemöter sökandens synpunkter från kommuniceringen (98 §).
      - Har överklagandehänvisning med form, innehåll, var och inom vilken tid (33 § FL).
      - Beslutet delges sökanden och fastighetsägaren (9 kap. 108 §).
      - Redovisar avgiften och hur den bestämts (107 §).
      - Skrivet begripligt, utan onödiga facktermer.
    modellsvar: >
      Byggnadsnämnden avslår ansökan med stöd av 9 kap. 56 § första stycket 2 PBL. Enligt
      detaljplanen får marken inom 6 m från södra gränsen inte bebyggas. Tillbyggnaden placeras
      till 80 procent på denna mark. Avvikelsen är därför inte liten och kan inte godtas enligt
      9 kap. 60 § PBL. Sökandens synpunkt att tillbyggnaden inte syns från gatan ändrar inte
      bedömningen, eftersom planbestämmelsen syftar till att hålla zonen mot grannen fri.
      Beslutet förses med upplysning om hur man överklagar, inom tre veckor från delgivningen,
      skriftligen till byggnadsnämnden med angivande av vilket beslut som överklagas och vilken
      ändring som begärs. Det delges sökanden och fastighetsägaren. Avgiften redovisas med
      hänvisning till taxan.
    lagrum:
      - PBL 9 kap. 56 §
      - PBL 9 kap. 60 §
      - FL 32 §
      - FL 33 §
      - PBL 9 kap. 108 §
    taggar: [motivering, avslag, beslut]

  - id: hand-047
    typ: oppen
    svarighet: 2
    status: utkast
    rattslage: "2025-12-01"
    fraga: >
      Förklara för en byggherre vad det betyder att lovet "gäller omedelbart" men ännu inte fått
      laga kraft. Vad bör hon tänka på innan hon börjar bygga?
    bedomningspunkter:
      - Lovet gäller omedelbart, även före laga kraft (9 kap. 114 § PBL).
      - Startbesked krävs ändå innan arbetet börjar (105 § 4, 10 kap. 3 §).
      - Lovet kan överklagas under överklagandetiden och kan upphävas.
      - Börjar hon före laga kraft kan hon behöva återställa om beslutet ändras (105 § 5).
      - Undantag när nämnden bestämt att lovet gäller först vid laga kraft (114 § andra stycket).
      - Giltighetstiden räknas från laga kraft (115 §).
    modellsvar: >
      Sedan 1 december 2025 gäller ett bygglov direkt från beslutet, även om det inte fått laga
      kraft (9 kap. 114 § PBL). Hon får ändå inte börja förrän nämnden gett startbesked. Under
      överklagandetiden kan grannar eller andra som berörs överklaga, och om länsstyrelsen eller
      domstolen upphäver lovet kan hon behöva riva eller återställa det som byggts, på egen
      bekostnad (105 § 5). Är det viktigt att undvika den risken bör hon vänta tills lovet fått
      laga kraft. I vissa ärenden har nämnden bestämt att lovet gäller först vid laga kraft, och då
      måste hon vänta. Lovet måste påbörjas inom två år och vara klart inom fem år från laga kraft
      (115 §).
    lagrum:
      - PBL 9 kap. 114 §
      - PBL 9 kap. 105 §
      - PBL 9 kap. 115 §
      - PBL 10 kap. 3 §
    taggar: [lov_galler, laga_kraft, service]
