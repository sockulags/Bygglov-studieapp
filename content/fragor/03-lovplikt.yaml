# Frågor för modul 03-lovplikt. En fil per modul. Valideras med zod (pnpm content:check).
# status: utkast tills handledaren granskat mot Lagtextens byggregler 2026-01-01.
# rattslage: vilket rättsläge frågan är skriven mot. PBL 9 kap skrevs om 2025-12-01.
# lagrum_osaker: true när paragrafnumreringen inte är kontrollerad efter omskrivningen.
modul: 03-lovplikt
fragor:
  - id: lov-001
    typ: flerval
    svarighet: 1
    status: utkast
    rattslage: "2025-12-01"
    lagrum_osaker: true
    fraga: >
      En fastighetsägare vill bygga en fristående komplementbyggnad på 25 kvm byggnadsarea
      i omedelbar närhet av sitt enbostadshus inom detaljplan. Nockhöjden blir 3,5 m och
      byggnaden placeras 2 m från tomtgräns. Det finns inga andra komplementbyggnader på
      tomten och området är inte särskilt värdefullt ur kulturhistorisk synpunkt. Vad gäller?
    alternativ:
      - text: Åtgärden kräver bygglov eftersom den överstiger 15 kvm.
      - text: Åtgärden kräver anmälan och startbesked, men inte bygglov.
      - text: Åtgärden kräver varken bygglov eller anmälan, men grannens skriftliga medgivande krävs för placeringen.
        ratt: true
      - text: Åtgärden kräver bygglov eftersom den ligger närmare tomtgräns än 4,5 m.
    forklaring: >
      Sedan den 1 december 2025 är en komplementbyggnad på högst 30 kvm med nockhöjd högst 4 m
      inom detaljplan bygglovsbefriad för en- och tvåbostadshus, inom en samlad pott om 45 kvm
      per tomt. Anmälningsplikten för sådana byggnader är slopad. Placering närmare gräns än
      4,5 m kräver dock grannens skriftliga medgivande. Byggherren måste ändå följa
      planbestämmelser och kraven på byggnadsverk. Före ändringen hade detta varit ett
      anmälningspliktigt attefallshus.
    lagrum:
      - PBL 9 kap.
    taggar: [komplementbyggnad, lovbefriad, grannmedgivande, pott]

  - id: lov-002
    typ: flersvar
    svarighet: 2
    status: utkast
    rattslage: "2025-12-01"
    lagrum_osaker: true
    fraga: Vilka av följande åtgärder kräver normalt bygglov inom detaljplanerat område?
    alternativ:
      - text: Byta färg på fasaden på ett flerbostadshus så att byggnadens karaktär väsentligt ändras.
        ratt: true
      - text: Sätta upp ett 1,7 m högt plank mot gatan.
        ratt: true
      - text: Måla om ett enbostadshus i samma kulör.
      - text: Ta i anspråk en lokal för ett väsentligt annat ändamål, t.ex. butik till restaurang.
        ratt: true
      - text: Bygga en komplementbyggnad på 14 kvm, 2,9 m nockhöjd, 4,5 m från gräns, på en tomt utan andra komplementbyggnader.
    forklaring: >
      Fasadändring som väsentligt ändrar byggnadens karaktär och väsentligt ändrad användning
      är lovpliktiga enligt 9 kap. 2 § PBL. Plank kräver lov enligt 6 kap. 1 § PBF. Den lilla
      komplementbyggnaden ryms inom de lovbefriade åtgärderna för en- och tvåbostadshus
      (högst 30 kvm per byggnad, 45 kvm sammanlagt inom plan, nockhöjd högst 4 m), och
      ommålning i samma kulör ändrar inte karaktären. Kontrollera gällande paragrafer i
      9 kap. efter omskrivningen den 1 december 2025.
    lagrum:
      - PBL 9 kap. 2 §
      - PBL 9 kap.
      - PBF 6 kap. 1 §
    taggar: [lovplikt, fasadandring, plank, andrad_anvandning, komplementbyggnad]

  - id: lov-003
    typ: lucktext
    svarighet: 1
    status: utkast
    rattslage: "2025-12-01"
    lagrum_osaker: true
    fraga: >
      Byggnadsnämnden ska meddela beslut i ett bygglovsärende inom ___ veckor från det att den
      fullständiga ansökan kom in. Tiden får förlängas en gång med högst ___ veckor.
    svar: ["10", "10"]
    forklaring: >
      9 kap. 27 § PBL. Om nämnden inte håller tiden reduceras avgiften med en femtedel per
      påbörjad vecka enligt 12 kap. 8 a § PBL.
    lagrum:
      - PBL 9 kap. 27 §
      - PBL 12 kap. 8 a §
    taggar: [handlaggningstid, avgift]

  - id: lov-004
    typ: oppen
    svarighet: 3
    status: utkast
    rattslage: "2025-12-01"
    lagrum_osaker: true
    fraga: >
      Förklara skillnaden mellan att avvisa, avslå och avskriva en bygglovsansökan. Ge ett
      exempel på när vart och ett är rätt utgång.
    bedomningspunkter:
      - "Avvisning: ansökan prövas inte i sak, t.ex. för att den trots föreläggande är ofullständig (9 kap. 22 § PBL)."
      - "Avslag: ansökan prövas i sak och åtgärden bedöms inte uppfylla kraven, t.ex. planstridig utan att avvikelsen är liten."
      - "Avskrivning: ärendet avslutas utan prövning för att sökanden återkallat eller frågan förfallit."
      - Anger att samtliga beslut ska motiveras och förses med överklagandehänvisning.
    modellsvar: >
      Avvisning innebär att nämnden inte prövar ansökan i sak, oftast för att den är så
      ofullständig att den inte kan prövas och sökanden inte avhjälpt bristerna efter
      föreläggande (9 kap. 22 § PBL). Avslag innebär att ansökan prövats i sak och att
      åtgärden inte uppfyller förutsättningarna för lov, t.ex. att den strider mot
      detaljplanen och avvikelsen inte kan godtas enligt 9 kap. 31 b §. Avskrivning används
      när ärendet inte längre behöver prövas, typiskt när sökanden återkallar ansökan.
      Alla tre är beslut som ska motiveras (32 § FL) och kunna överklagas (13 kap. PBL).
    lagrum:
      - PBL 9 kap. 22 §
      - PBL 9 kap. 31 b §
      - FL 32 §
    taggar: [avvisning, avslag, avskrivning, beslut]
