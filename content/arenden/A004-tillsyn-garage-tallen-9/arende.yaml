# Nivå 4-ärende (tillsyn). Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan.
# Lagrum kontrollerade 2026-11-05 mot docs/rattslage/pbl-11-kap.txt, pbf-9-kap.txt,
# pbl-9-kap.txt, pbl-10-kap.txt, pbl-12-kap.txt, fl.txt och boverket-tillsyn-utdrag.txt.
# Prisbasbelopp 2026: 59 200 kr (SCB, docs/rattslage/prisbasbelopp.txt). Byggsanktionsavgiften
# bestäms med prisbasbeloppet för det år beslutet fattas (PBF 9 kap. 1 §). Simuleringens
# tidslinje är fast (inga slumphändelser) och beslutet fattas den 15 oktober 2026.
#
# Avgiftsberäkningen (se även H4 och facit):
#   (a) Påbörjande utan startbesked av de delar som avviker från lovet (förrådsdelen och det
#       högre taket), PBF 9 kap. 6 § första stycket 2, komplementbyggnad:
#       0,25 pbb + 0,005 pbb × byggnadens sanktionsarea. Sanktionsarea = BTA − 15 kvm
#       (PBF 1 kap. 7 §) = 56 − 15 = 41 kvm → 0,455 pbb = 26 936 kr. Ingen halvering enligt
#       9 kap. 3 a §, eftersom de avvikande delarna saknade lov.
#   (b) Ibruktagande utan slutbesked, PBF 9 kap. 18 § första stycket 2:
#       0,05 pbb + 0,001 pbb × sanktionsarea. Förbudet i 10 kap. 4 § PBL gäller bara de delar
#       som omfattas av startbeskedet (40 kvm, garaget enligt lovet), så sanktionsarean är
#       40 − 15 = 25 kvm (1 kap. 7 § och 9 kap. 18 § andra stycket) → 0,075 pbb = 4 440 kr.
#       Avdraget på 15 kvm står inte i 18 §, så det är en tolkning som handledaren ska pröva
#       (docs/07-roadmap.md). Utan avdrag blir det 40 kvm och 5 328 kr.
#   Summa före rättelse 31 376 kr. Efter att förrådsdelen rivits före sammanträdet (E3,
#   11 kap. 54 § PBL) är byggnaden 40 kvm: (a) 0,25 + 0,005 × 25 = 0,375 pbb = 22 200 kr,
#   (b) oförändrad 4 440 kr (ibruktagandet har redan skett och kan inte rättas i efterhand).
#   Summa 26 640 kr. Belopp avrundas nedåt till hela kronor.
id: A004
titel: "Tillsyn: garage byggt större än lovet"
niva: 4
status: utkast
rattslage: "2025-12-01"
fastighet: Tallen 9, Åkerslunda kommun
moduler: [10-tillsyn]
sammanfattning: >
  En granne anmäler att garaget på Tallen 9 har byggts större och högre än bygglovet från 2024
  och att det används trots att slutbesked saknas. Du utreder anmälan, gör platsbesök, räknar
  ut byggsanktionsavgiften, kommunicerar förslaget, bemöter byggherrens invändningar om
  preskription och nedsättning, prövar om lov kan ges i efterhand och skriver nämndens beslut
  om avgift och rättelseföreläggande. Strax före sammanträdet rättar byggherren en del av
  avvikelsen.
startdatum: 2026-08-17
larandemal:
  - Ta ställning till en tillsynsanmälan och nämndens skyldighet att pröva ingripande (11 kap. 5 § PBL)
  - Dokumentera ett platsbesök och mäta avvikelser mot lov och detaljplan
  - Beräkna byggsanktionsavgift med sanktionsarea och prisbasbelopp (PBF 9 kap.)
  - Kommunicera ett förslag till byggsanktionsavgift (11 kap. 58 § PBL) och bemöta invändningar om preskription och nedsättning (11 kap. 53 a och 58 §§)
  - Avgöra om lov kan ges i efterhand eller om rättelseföreläggande krävs (9 kap. 56 och 60 §§, 11 kap. 17 och 20 §§)
  - Räkna om avgiften när rättelse delvis sker före sammanträdet (11 kap. 54 §)
  - Skriva ett tillsynsbeslut med avgift, föreläggande, överklagandehänvisning och rätt expediering

parter:
  # Ägarna är både sökande av lov i efterhand och avgiftsskyldiga. Anmälaren äger Tallen 8.
  sokande: [Henrik Ström]
  fastighetsagare: [Henrik Ström, Lena Ström]
