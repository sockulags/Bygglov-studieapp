      prickmark: [{ sida: norr, djup: 6 }]
      gata: { sida: norr, namn: Lärkvägen, fastighet: "Åkerslunda 1:1" }
      grannar: { norr: Sparven 2, oster: Lärken 3, soder: Lärken 9, vaster: Lärken 5 }
