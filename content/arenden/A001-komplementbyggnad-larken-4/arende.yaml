# Nivå 1-ärende. Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan.
# Lagrum i 9 kap. PBL är kontrollerade mot docs/rattslage/pbl-9-kap.txt (lydelse 2025:974).
# PBL 10 kap. 2 a och 3 §§, PBL 12 kap. 8 §, PBF 6 kap. 1 § och 7 kap. 5 § samt FL 6 § är
# kontrollerade mot riksdagen.se (hämtade 2026-11-04).
id: A001
titel: Komplementbyggnad nära gräns
niva: 1
status: utkast
rattslage: "2025-12-01"
fastighet: Lärken 4, Åkerslunda kommun
sammanfattning: >
  Sökandena vill bygga ett förråd med verkstad på 28 kvm vid sitt enbostadshus. Fastigheten
  ligger inom detaljplan och det finns inga andra komplementbyggnader på tomten. Byggnaden
  hade varit bygglovsbefriad, men den placeras 3,0 meter från gränsen mot grannen. Ansökan är
  komplett. Under handläggningen kommer grannarnas skriftliga medgivande in.
startdatum: 2026-04-07
moduler: [03-lovplikt, 06-handlaggning, 01-forvaltningsratt, 13-kommunikation]
larandemal:
  - Pröva om en komplementbyggnad är bygglovsbefriad enligt 9 kap. 4 § PBL
  - Se att 9 kap. 34 § ger lovplikt närmare gränsen än 4,5 meter och att ett skriftligt grannmedgivande tar bort den (35 §)
  - Ge sökanden service och begriplig information (FL 6 §)
  - Välja rätt sätt att avsluta ärendet när lov inte längre krävs, avskrivning eller frivilligt lov (9 kap. 52 och 79 §§)
  - Upplysa om anmälningsplikt för installationer (PBF 6 kap.) och om 10 kap. 2 a § PBL

taxa:
  # Förenklad fiktiv taxa. Varje post är ett möjligt avgiftsbelopp i beslutet.
  avskrivning_efter_aterkallelse: 1300      # en timmes handläggning (12 kap. 8 § 9 PBL)
  lov_komplementbyggnad_16_30kvm: 6500      # om ansökan prövas, även som frivilligt lov
  reduktion_per_vecka: 0.2

