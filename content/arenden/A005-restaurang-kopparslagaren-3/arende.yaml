# Nivå 2-ärende. Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan och fiktivt kulturmiljöprogram.
# Lagrum i 9 kap. PBL är kontrollerade mot docs/rattslage/pbl-9-kap.txt (lydelse 2025:974).
# PBL 1, 2, 8, 10, 12 och 13 kap., PBF 5 och 6 kap., FL, MB 9 kap. och KML 3 kap. är
# kontrollerade mot utdragen i docs/rattslage/ (hämtade från riksdagen.se 2026-11-04–05).
# Ärendet utspelar sig under 2026, alltså före 2027-01-01: 8 kap. 2 och 7 §§ PBL och
# 9 kap. 56 § gäller i nuvarande lydelse.
# Lokalen ligger i husets östra del. Situationsplanens x-axel går åt öster; sedd från
# Storgatan (norr) ligger öster till vänster, så fasadritningens x = 18 − situationsplanens x.
# Planritningen har egna koordinater: x = 0 är lokalens västra vägg (situationsplanens x = 7).
id: A005
titel: Fasadändring och ny restaurang i centrum
niva: 2
status: utkast
rattslage: "2025-12-01"
fastighet: Kopparslagaren 3, Åkerslunda kommun
sammanfattning: >
  En butikslokal i bottenvåningen på ett bostads- och affärshus från 1924 vid Storgatan ska
  bli restaurang. Sökanden, som hyr lokalen, vill slå samman skyltfönstren, bredda entrén,
  sätta upp en skylt och dra en köksventilationskanal på gårdsfasaden. Huset ligger inom
  detaljplan med centrumändamål och är utpekat som särskilt värdefullt i kommunens
  kulturmiljöprogram, men planen saknar skyddsbestämmelser. Ansökan behöver kompletteras,
  stadsantikvarien kräver en annan entrélösning och en hyresgäst i huset oroar sig för buller.
startdatum: 2026-04-13
moduler: [03-lovplikt, 07-krav-byggnadsverk, 06-handlaggning, 01-forvaltningsratt]
larandemal:
  - Avgöra lovplikten för ändrad användning (9 kap. 15 § 1), fasadändring mot allmän plats (15 § 3) och åtgärder på en särskilt värdefull byggnad (37 och 38 §§)
  - Förstå att skyltar inte längre är generellt lovpliktiga efter 2025-12-01, men kan kräva lov som fasadändring eller i särskilt värdefulla miljöer
  - Pröva förvanskningsförbudet och varsamhetskravet (8 kap. 13 och 17 §§) för en byggnad som saknar q-bestämmelse men pekas ut i kulturmiljöprogrammet
  - Väga varsamhet mot kravet på tillgänglig entré till en publik lokal (8 kap. 1 § 3 och 4 § första stycket 8)
  - Förelägga om komplettering (9 kap. 91 §) och hantera ändrade ritningar som kommer in på sökandens initiativ (99 § första stycket 2, 100 § 2)
  - Skicka remisser till stadsantikvarien och miljöenheten och hålla isär lovprövningen och miljöbalkens regler om störningar
  - Se att en planenlig åtgärd inte kräver underrättelse (94 §) men att beslutet ändå kungörs och meddelas (109–110 §§)
  - Skriva ett beslut med preciserade villkor om utförande, upplysningar enligt 105 § och rätt expediering

parter:
  # Grannarna är ägarna till fastigheterna som gränsar till Kopparslagaren 3 eller ligger
  # mitt emot på andra sidan Storgatan. De ska få meddelande om kungörelsen (9 kap. 110 § 1).
  sokande: [Bistro Kopparn AB, Leila Haddad]
  fastighetsagare: [Fastighets AB Kopparslagaren]
  grannar:
    - { fastighet: Kopparslagaren 2, namn: [Åkerslunda Bostäder AB] }
    - { fastighet: Kopparslagaren 4, namn: [Margareta Wiklund, Lars Wiklund] }
    - { fastighet: Kopparslagaren 7, namn: [Bostadsrättsföreningen Kopparslagaren 7] }
    - { fastighet: Smeden 5, namn: [Smedjan Fastigheter AB] }

taxa:
  # Förenklad fiktiv taxa. Posten omfattar ändrad användning med fasadändring, remisser och
  # kungörelse.
  bygglov_ändrad_användning_med_fasadändring: 15800
  reduktion_per_vecka: 0.2

