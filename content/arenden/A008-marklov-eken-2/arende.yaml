# Nivå 2-ärende. Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan.
# Lagrum kontrollerade mot docs/rattslage/ (hämtade från riksdagen.se 2026-11-04–05):
# PBL 2, 4, 8, 9, 10, 12 och 13 kap., PBF 7 och 9 kap., JB 3 kap. och ordningslagen 3 kap. 5 §
# (ol-3-kap-utdrag.txt, hämtad 2026-11-05).
# Detaljplanen antogs 2009. Bestämmelsen om krav på marklov för trädfällning (a1) beslutades
# när kommunen ännu fick utöka lovplikten i detaljplan; den gäller fortfarande genom 9 kap.
# 47 § 2 PBL. Bestämmelserna n1 och n2 är bestämmelser om vegetation och markens höjdläge
# (4 kap. 10 § PBL), så trädfällningen kräver också lov enligt 47 § 3 a.
# Tidslinje: ansökan 2026-03-09, föreläggande 2026-03-11 (inom tre veckor), komplett
# 2026-03-27, tioveckorsfristen löper ut 2026-06-05 (9 kap. 99 § första stycket 4).
# Underrättelse 2026-03-30, grannens yttrande 2026-04-14, beslut omkring 2026-04-28.
id: A008
titel: Marklov och trädfällning på Eken 2
lovtyp: marklov
niva: 2
status: utkast
rattslage: "2025-12-01"
fastighet: Eken 2, Åkerslunda kommun
sammanfattning: >
  Ägarna till ett enbostadshus i villaområdet Ekbacken vill anlägga en pool med ett
  pooldäck som schaktas in i slänten, och fälla tre ekar. Detaljplanen skyddar ekarna och
  begränsar hur mycket marken får ändras, och den kräver marklov för att fälla ekar. Ansökan
  saknar underlag om trädens hälsa. En arborist visar att en av ekarna är rötskadad. Grannen
  i öster påpekar att en av ekarna står i gränsen och att de inte går med på att den fälls.
startdatum: 2026-03-09
moduler: [03-lovplikt, 04-detaljplan, 06-handlaggning, 07-krav-byggnadsverk, 11-angransande]
larandemal:
  - Avgöra när schaktning kräver marklov (9 kap. 47 § 1, mer än 0,5 meter) och när trädfällning gör det (47 § 2 och 3 a med 4 kap. 10 §)
  - Se att en pool i sig inte kräver lov, men att ägaren ansvarar för säkerheten (ordningslagen 3 kap. 5 §, Boverkets byggregler)
  - Pröva marklov enligt 9 kap. 77 § och en liten avvikelse enligt 78 §, med 2 kap. 6 § och 8 kap. 9 § om tomten, dagvatten och skyfall
  - Underrätta grannarna när ansökan avviker från planen (9 kap. 94–96 §§) och hantera ett grannyttrande som rör civilrätt (JB 3 kap. 1–3 §§)
  - Dela upp beslutet, bevilja det som uppfyller förutsättningarna och avslå resten, och ställa preciserade villkor om ersättningsträd och rotskydd med stöd av 9 kap. 105 § 6
  - Ta ställning till om ett lov för trädfällning ska gälla först när det fått laga kraft (9 kap. 114 § andra stycket)

parter:
  sokande: [Tove Rahimi, Ali Rahimi]
  fastighetsagare: [Tove Rahimi, Ali Rahimi]
  grannar:
    - { fastighet: Eken 1, namn: [Lisa Kraft] }
    - { fastighet: Eken 3, namn: [Gun Holmqvist, Sven-Erik Holmqvist] }
    - { fastighet: Eken 7, namn: [Åsa Nyberg, Peter Nyberg] }
    - { fastighet: Hasseln 4, namn: [Nils Bergqvist] }
    - { fastighet: Åkerslunda 4:1, namn: [Åkerslunda kommun] }

