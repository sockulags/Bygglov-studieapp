steg:
  - id: S1
    typ: checklista
    rubrik: Är anmälan komplett?
    instruktion: >
      Gå igenom handlingarna och markera vad som finns. En anmälan ska innehålla det som
      behövs för att nämnden ska kunna ge startbesked, men inte mer än så.
    poster:
      - { text: Ifylld och undertecknad anmälan med byggherrens uppgifter, finns: true }
      - { text: Planritning som visar kaminens och servisens placering, finns: true }
      - { text: "Produktblad för kaminen och skorstenen med avstånd till brännbart material", finns: true }
      - { text: Förslag till kontrollplan, finns: true }
      - { text: Beskrivning av VA-installationen och var huset ansluts till det kommunala nätet, finns: true, kommentar: "Finns i anmälan, punkt 2. Själva förbindelsepunkten och ledningarna i tomtmark hanteras av VA-huvudmannen." }
      - { text: Skorstensfejarens bedömning av skorstenens placering och åtkomsten för sotning och brandskyddskontroll, finns: false, kommentar: "Nämnden behöver den för att bedöma om skorstenen kan antas uppfylla kraven på brandskydd och säkerhet vid användning, och kommunens anvisningar för anmälan av eldstad kräver den. Förelägg om komplettering." }
      - { text: Anmälan om kontrollansvarig, finns: false, kommentar: "Krävs inte för en åtgärd som omfattas av krav på anmälan (PBF 7 kap. 5 § 2)." }
      - { text: Avfallshanteringsplan, finns: false, kommentar: "Kravet gäller inte om det är uppenbart att behov saknas (10 kap. 8 a § andra stycket PBL). Här blir det bara emballage, gipsspill och några meter gamla rör, och kontrollplanen anger hur det tas om hand." }
    forklaring: >
      En anmälan handläggs som en ansökan om lov i de delar som PBF 6 kap. 5 § räknar upp:
      den ska innehålla det som 9 kap. 86 § PBL kräver, nämnden får förelägga om komplettering
      enligt 9 kap. 91 §, och tidsfristerna i 99–101 §§ gäller med en skillnad: fristen är
      fyra veckor i stället för tio. Utöver det ska en anmälan innehålla de handlingar som
      krävs för beslut om startbesked (PBF 6 kap. 6 §). Anmälan kom in den 14 september 2026.
      Förelägger du om komplettering inom tre veckor räknas de fyra veckorna från den dag
      kompletteringen kommer in (9 kap. 99 § första stycket 4). Kontrollansvarig behövs inte
      för en anmälningspliktig åtgärd.
    lagrum: [PBF 6 kap. 5 §, PBF 6 kap. 6 §, PBL 9 kap. 86 §, PBL 9 kap. 91 §, PBL 9 kap. 99 §, PBF 7 kap. 5 §, PBL 10 kap. 8 a §]
    tid_framat_dagar: 1

  - id: S2
    typ: fraga
    rubrik: Anmälan eller lov?
    instruktion: Läs anmälan och planritningen. Pröva varje del för sig, kaminen, skorstenen och VA-anslutningen.
    fragetyp: flersvar
    fraga: Vilka påståenden om åtgärderna på Rönnen 11 stämmer?
    alternativ:
      - text: Installationen av kaminen och den nya skorstenen kräver anmälan, eftersom det är installation av en eldstad och en rökkanal i en byggnad (PBF 6 kap. 1 § 4).
        ratt: true
      - text: De nya vatten- och avloppsledningarna i huset kräver anmälan (PBF 6 kap. 1 § 5). Ledningarna i tomtmark och förbindelsepunkten hanteras av VA-huvudmannen.
        ratt: true
      - text: Anmälningsplikten följer av föreskrifter som 9 kap. 55 § PBL hänvisar till. Den gäller bara åtgärder som inte redan kräver lov.
        ratt: true
      - text: Skorstenen kräver bygglov som fasadändring, eftersom den syns från gatan.
      - text: Skorstenen kräver bygglov enligt 9 kap. 28 §, eftersom paragrafen räknar upp skorstenar.
      - text: Det krävs en kontrollansvarig och ett tekniskt samråd, eftersom installationen påverkar brandskyddet.
      - text: Om nämnden inte har hört av sig inom fyra veckor får byggherren börja installera.
    forklaring: >
      9 kap. 55 § PBL säger bara att det kan finnas föreskrifter om anmälan för åtgärder som
      inte kräver lov. Föreskrifterna finns i PBF 6 kap. 1 §: installation av en eldstad och en
      rökkanal (punkt 4) och av en anläggning för vatten och avlopp i en byggnad (punkt 5).
      Undantagen i 2 § gäller inte här. Skorstenen ändrar husets yttre, men fasadändring kräver
      bara bygglov på andra byggnader än en- och tvåbostadshus (9 kap. 15 § 3), och detaljplanen
      har ingen egen lovplikt. 9 kap. 28 § 3 gäller skorstenar som är högre än 20 meter eller
      står närmare gränsen än sin höjd; den här är 7,6 meter över marken och 9 meter från
      närmaste gräns. Kontrollansvarig krävs inte för anmälningspliktiga åtgärder (PBF 7 kap.
      5 § 2), och då behövs inget tekniskt samråd om det inte är uppenbart befogat eller
      byggherren begär det (10 kap. 14 §). Nämnden ska i stället ge startbesked direkt eller
      förelägga om de handlingar som saknas (10 kap. 22 §). Det finns inget "tyst
      godkännande": en anmälningspliktig åtgärd får aldrig påbörjas utan startbesked (10 kap.
      3 § första stycket 2).
    lagrum: [PBL 9 kap. 55 §, PBF 6 kap. 1 §, PBF 6 kap. 2 §, PBL 9 kap. 15 §, PBL 9 kap. 28 §, PBF 7 kap. 5 §, PBL 10 kap. 3 §, PBL 10 kap. 14 §, PBL 10 kap. 22 §]

  - id: S3
    typ: skrivelse
    rubrik: Skriv föreläggande om komplettering
    instruktion: >
      Skriv föreläggandet till Hanna och Mikael Forsberg. Ange vad som saknas och varför, en
      svarstid och vad som händer om de inte kompletterar. Berätta också vad som gäller för
      tidsfristen och för att börja arbetet.
    ar_forelaggande: true
    bedomningspunkter:
      - Begär skorstensfejarens bedömning av skorstenens placering och höjd över taket och av åtkomsten för sotning och brandskyddskontroll (takbrygga, takstege)
      - Förklarar kort varför underlaget behövs, för att nämnden ska kunna bedöma brandskydd och säkerhet vid användning inför startbeskedet (PBF 6 kap. 6 §, 10 kap. 23 c § PBL)
      - Anger en bestämd svarstid
      - Upplyser om att anmälan kan avvisas eller ärendet avgöras i befintligt skick om föreläggandet inte följs (9 kap. 91 § PBL genom PBF 6 kap. 5 §)
      - Skickas inom tre veckor från att anmälan kom in och säger att fyraveckorsfristen räknas från den dag kompletteringen kommer in (9 kap. 99 § första stycket 4, PBF 6 kap. 5 §, 100 § 2)
      - Påminner om att arbetet inte får påbörjas förrän nämnden gett startbesked, och att byggsanktionsavgift annars tas ut
      - Begriplig och vänlig ton, med kontaktuppgifter till handläggaren
    modelltext: handlingar/modell-forelaggande.md
    forklaring: >
      Ett föreläggande om komplettering är ett beslut riktat till byggherren. Det ska säga
      exakt vad som saknas, när det ska vara inne och vad följden blir om inget kommer in.
      Eftersom PBF 6 kap. 5 § gör 9 kap. 91 och 99–101 §§ PBL tillämpliga på anmälan gäller
      samma regler som för en lovansökan, men fristen är fyra veckor.
    lagrum: [PBL 9 kap. 91 §, PBF 6 kap. 5 §, PBL 9 kap. 99 §, PBL 9 kap. 100 §, PBL 10 kap. 3 §]

  - id: S4
    typ: fraga
    rubrik: Vad ska startbeskedet innehålla?
    instruktion: >
      Kompletteringen har kommit in. Läs skorstensfejarens bedömning och den kompletterade
      kontrollplanen innan du svarar.
    fragetyp: flersvar
    fraga: Vilka påståenden om startbeskedet stämmer?
    alternativ:
      - text: Startbeskedet ska vara skriftligt och ges om åtgärden kan antas uppfylla de tekniska egenskapskraven (10 kap. 23 c § PBL).
        ratt: true
      - text: I startbeskedet fastställer nämnden kontrollplanen och bestämmer vilka handlingar som ska lämnas in inför slutbeskedet, t.ex. skorstensfejarens besiktningsprotokoll och intyg om täthetsprovning (10 kap. 24 § 1 och 4).
        ratt: true
      - text: Startbeskedet gäller omedelbart och upphör att gälla två år efter att det gavs (10 kap. 24 a § och 25 § andra stycket).
        ratt: true
      - text: Startbeskedet bör upplysa om att VA-huvudmannen ska godkänna anslutningen och att miljöenheten ska kontaktas om den gamla avloppsanläggningen (10 kap. 24 § 5).
        ratt: true
      - text: Kaminen får användas så snart den är installerad och skorstensfejaren har besiktigat den.
      - text: Startbeskedet gäller först när det har fått laga kraft, tre veckor efter att det delgetts.
      - text: Startbeskedet ska kungöras på kommunens anslagstavla.
    forklaring: >
      För en anmälningspliktig åtgärd ges startbeskedet enligt 10 kap. 23 c § PBL: nämnden ska
      skriftligen godkänna att åtgärden får påbörjas om den kan antas uppfylla de tekniska
      egenskapskraven i 8 kap. 4–7 §§. Innehållet styrs av 24 §: kontrollplanen fastställs,
      villkor för att påbörja bestäms om de behövs, handlingarna inför slutbeskedet anges och
      nämnden upplyser om krav enligt annan lagstiftning. Startbeskedet gäller omedelbart
      (24 a §). För en anmälningspliktig åtgärd upphör det att gälla två år efter att det gavs
      (25 § andra stycket). Kaminen och de nya ledningarna får inte tas i bruk förrän nämnden
      gett slutbesked (10 kap. 4 och 34 §§); skorstensfejarens besiktning är ett underlag för
      slutbeskedet, inte en ersättning för det. Kungörelse gäller beslut om lov och
      förhandsbesked (9 kap. 109 §), inte startbesked.
    lagrum: [PBL 10 kap. 23 c §, PBL 10 kap. 24 §, PBL 10 kap. 24 a §, PBL 10 kap. 25 §, PBL 10 kap. 4 §, PBL 10 kap. 34 §, PBL 9 kap. 109 §]
    tid_framat_dagar: 1

  - id: S5
    typ: beslut
    rubrik: Ge startbesked
    instruktion: >
      Skriv beslutet. Välj "Ge startbesked" i formuläret: det är ett startbesked, inte ett
      bygglov. Fastställ kontrollplanen, ange vad som ska lämnas in inför slutbeskedet, redovisa
      avgiften och skriv hur beslutet kan överklagas. Behövs ett villkor för att få påbörja, t.ex.
      att takbryggan och stegen ska vara monterade innan kaminen ansluts, skriver du det under
      villkor och upplysningar (10 kap. 24 § 2 PBL).
    forvantat_beslut: startbesked
    lagrum: [PBL 9 kap. 55 §, PBL 10 kap. 23 c §, PBL 10 kap. 24 §]
    bedomningspunkter:
      - Beslutet är ett startbesked enligt 10 kap. 23 c § PBL för installation av eldstad och rökkanal och av vatten och avlopp i byggnaden (PBF 6 kap. 1 § 4 och 5), inte ett bygglov
      - Skälen visar att åtgärden kan antas uppfylla kraven på brandskydd, säkerhet vid användning och vatten och avlopp (8 kap. 4 § PBL), med stöd av produktbladet och skorstensfejarens bedömning
      - Fastställer den kompletterade kontrollplanen med vem som gör varje kontroll (10 kap. 24 § 1), och konstaterar att kontrollansvarig inte krävs (PBF 7 kap. 5 § 2), att tekniskt samråd inte behövs (10 kap. 14 och 22 §§) och att avfallshanteringsplan inte behövs (10 kap. 8 a §)
      - Anger handlingarna inför slutbesked (10 kap. 24 § 4), signerad kontrollplan, skorstensfejarens besiktningsprotokoll och VVS-installatörens intyg om provtryckning och täthetsprovning
      - Upplyser om att kaminen och de nya ledningarna inte får tas i bruk förrän slutbesked getts (10 kap. 4 och 34 §§), och om byggsanktionsavgift för att börja före startbesked eller använda före slutbesked (PBF 9 kap. 13 § och 24 §)
      - Upplyser om att startbeskedet gäller omedelbart och upphör att gälla två år efter att det gavs (10 kap. 24 a § och 25 § andra stycket)
      - Upplyser om annan lagstiftning (10 kap. 24 § 5), anmälan till sotningsväsendet (LSO 3 kap. 4 §), VA-huvudmannens godkännande och miljöenheten för den gamla avloppsanläggningen
      - Avgiften 4 300 kr redovisas med hur den bestämts, utan reduktion eftersom beskedet ges inom fyra veckor från kompletteringen (9 kap. 107 § och 12 kap. 8 a § andra stycket PBL, PBF 6 kap. 5 §)
      - Överklagandehänvisning till länsstyrelsen inom tre veckor från delgivningen (13 kap. 3 § PBL, 44 § FL), med upplysning om att behovet av kontrollplan, kontrollansvarig och tekniskt samråd inte kan överklagas (13 kap. 2 § 5)
      - Beslutet delges byggherrarna, som också är fastighetsägare, så att överklagandetiden börjar löpa; det kungörs inte och grannarna får inget meddelande eftersom det inte är ett beslut om lov (9 kap. 109 och 110 §§)
    modellbeslut: handlingar/modell-startbesked.md

handelser:
  - id: E1
    namn: Skorstensfejarens bedömning kommer in
    utlosare: { efter_steg: S3 }
    effekt:
