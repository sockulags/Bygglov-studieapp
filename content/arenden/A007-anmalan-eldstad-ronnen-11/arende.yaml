      visa_handlingar: [H5, H6]
      satt_komplett_datum: true
      andrade_fakta: { skorstensfejarens_bedomning: true, kontrollplan_kompletterad: true }
      meddelande: >
        Hanna Forsberg har mejlat in skorstensfejarens bedömning och ett kompletterat förslag
        till kontrollplan. Skorstensfejaren godtar placeringen men kräver takbrygga, fast
        takstege och glidskydd, och vill besiktiga installationen innan kaminen används.
        Anmälan är nu komplett. Eftersom föreläggandet skickades inom tre veckor räknas
        fyraveckorsfristen från i dag, den {{simdatum}}, och löper ut den {{simdatum+28}}
        (9 kap. 99 § första stycket 4 PBL och PBF 6 kap. 5 §).

facit:
  sammanfattning: >
    Kaminen, skorstenen och de nya VA-ledningarna i huset kräver anmälan enligt PBF 6 kap.
    1 § 4 och 5, inte lov: skorstenen är en fasadändring på ett enbostadshus och kräver inte
    bygglov. Anmälan kompletteras efter ett föreläggande med skorstensfejarens bedömning, och
    fyraveckorsfristen räknas från kompletteringen. Kontrollansvarig och tekniskt samråd
    behövs inte. Nämnden ger ett skriftligt startbesked enligt 10 kap. 23 c § som fastställer
    kontrollplanen, anger handlingarna inför slutbeskedet och gäller omedelbart.
  vanliga_fel:
    - Att behandla ärendet som en bygglovsansökan och kungöra beslutet eller underrätta grannar
    - Att kräva bygglov för skorstenen som fasadändring, trots att huset är ett enbostadshus
    - Att räkna tio veckors handläggningstid i stället för fyra (PBF 6 kap. 5 §)
    - Att kräva kontrollansvarig eller kalla till tekniskt samråd utan skäl
    - Att tro att skorstensfejarens besiktning ersätter slutbeskedet, eller att kaminen får användas innan slutbesked getts
    - Att hänvisa till den gamla anmälningsplikten för attefallsåtgärder, som inte finns längre
  modellbeslut: handlingar/modell-startbesked.md
