  # (12 kap. 8 § 1 och 9 PBL). Reduktion med en femtedel per påbörjad vecka som
  # fyraveckorsfristen överskrids (12 kap. 8 a § andra stycket PBL, PBF 6 kap. 5 §).
  anmälan_eldstad_rökkanal_och_VA_med_startbesked: 4300
  reduktion_per_vecka: 0.2

