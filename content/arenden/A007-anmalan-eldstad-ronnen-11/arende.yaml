# Nivå 1-ärende: anmälan, inte lov. Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan.
# Lagrum kontrollerade mot docs/rattslage/ (hämtade från riksdagen.se 2026-11-04–05):
# PBL 9 kap. (pbl-9-kap.txt), PBL 10 kap. i lydelsen från 2026-07-01 (pbl-10-kap.txt),
# PBL 12 kap. 8 och 8 a §§, PBL 13 kap. 2 och 3 §§, PBF 6, 7 och 9 kap. och LSO 3 kap. 4 §.
# Anmälan handläggs enligt PBF 6 kap. 5 §, som gör 9 kap. 85, 86, 90, 91, 99–101 och 107 §§
# PBL tillämpliga, med en tidsfrist på fyra veckor i stället för tio. Beslutet har utfallet
# "startbesked" (10 kap. 23 c § PBL). Då räknar ärendemotorn ärendet som en anmälan: fristen
# är fyra veckor och kan förlängas med högst fyra (PBF 6 kap. 5 §), och beslutskontrollen
# rättar startbeskedet efter 10 kap. 24 § och inte efter reglerna om lov.
# Prisbasbeloppet 2026 är 59 200 kr (prisbasbelopp.txt).
id: A007
titel: "Anmälan: installation av eldstad och ny VA-anslutning"
niva: 1
status: utkast
rattslage: "2025-12-01"
fastighet: Rönnen 11, Åkerslunda kommun
sammanfattning: >
  Ägarna till ett enbostadshus inom detaljplan vill installera en braskamin med en ny
  stålskorsten genom taket och ansluta huset till det kommunala vatten- och avloppsnätet,
  som nyss byggts ut i området. Det är en anmälan, inte en ansökan om lov. Anmälan saknar
  skorstensfejarens bedömning av skorstenens placering och åtkomst för sotning, men den
  kommer in efter ett föreläggande. Ärendet slutar med ett startbesked.
startdatum: 2026-09-14
moduler: [03-lovplikt, 09-genomforande, 06-handlaggning, 10-tillsyn]
larandemal:
  - Skilja mellan lov och anmälan efter 2025-12-01, där 9 kap. 55 § PBL hänvisar till anmälningsplikten i PBF 6 kap. 1 § (eldstad, rökkanal, vatten och avlopp)
  - Se att en fasadändring på ett enbostadshus inte kräver bygglov (9 kap. 15 § 3) och att skorstenen därför bara kräver anmälan
  - Veta vad en anmälan ska innehålla (PBF 6 kap. 5 och 6 §§ med 9 kap. 86 § PBL) och förelägga om komplettering (9 kap. 91 §)
  - Räkna tidsfristen för en anmälan, fyra veckor (PBF 6 kap. 5 § andra stycket), och avgiftsreduktionen (12 kap. 8 a § andra stycket PBL)
  - Veta när kontrollansvarig och tekniskt samråd inte behövs (PBF 7 kap. 5 § 2, 10 kap. 14 och 22 §§ PBL)
  - Ge ett skriftligt startbesked med fastställd kontrollplan och handlingar inför slutbesked (10 kap. 23 c, 24 och 24 a §§), och upplysa om slutbesked (10 kap. 4 och 34 §§) och byggsanktionsavgift (PBF 9 kap. 13 och 24 §§)

parter:
  # Sökandena är också fastighetsägare. Grannar hörs inte i ett anmälningsärende.
  sokande: [Hanna Forsberg, Mikael Forsberg]
  fastighetsagare: [Hanna Forsberg, Mikael Forsberg]

taxa:
