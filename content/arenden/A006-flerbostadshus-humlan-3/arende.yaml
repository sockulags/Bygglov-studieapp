steg:
  - id: S1
    typ: checklista
    rubrik: Är ansökan komplett?
    instruktion: >
      Gå igenom handlingarna. Markera vad som finns. Skilj på det som behövs för
      lovprövningen och det som lämnas in till det tekniska samrådet.
    poster:
      - { text: Ifylld och undertecknad ansökan, finns: true }
      - { text: "Situationsplan med byggnader, prickmark, utfart, parkering och friyta", finns: true }
      - { text: Fasadritningar, finns: true }
      - { text: Planritningar, finns: true }
      - { text: "Marknivåer, gatans nivå och takets höjd", finns: true, kommentar: "Behövs för att räkna byggnadshöjden. Står i ansökan, punkt 2." }
      - { text: Bullerutredning, finns: true, kommentar: "Behövs för att visa att planbestämmelsen m1 följs." }
      - { text: Redovisning av dagvatten och genomsläpplig mark, finns: true, kommentar: "Behövs för planbestämmelsen n1." }
      - { text: Uppgift om kontrollansvarig, finns: true, kommentar: "Ett flerbostadshus kräver kontrollansvarig (10 kap. 9 § PBL), och ansökan ska ange vem som föreslås (9 kap. 86 § 3 b)." }
      - { text: Brandskyddsbeskrivning, finns: false, kommentar: "Lämnas till det tekniska samrådet (10 kap. 18 §)." }
      - { text: Förslag till kontrollplan, finns: false, kommentar: "Lämnas till det tekniska samrådet (10 kap. 18 §)." }
    forklaring: >
      Ansökan innehåller det som behövs för lovprövningen (9 kap. 86 §), så något
      föreläggande om komplettering behövs inte (91 §). Tioveckorsfristen räknas därför från
      ansökningsdagen den 16 februari 2026 och löper ut den 27 april 2026 (9 kap. 99 § första
      stycket 1). Sökanden ska skriftligen informeras om fristen, om att avgiften reduceras om
      den överskrids och om möjligheten att överklaga (100 § 1). Brandskyddsbeskrivning och
      kontrollplan behövs först inför startbeskedet.
    lagrum: [PBL 9 kap. 86 §, PBL 9 kap. 91 §, PBL 9 kap. 99 §, PBL 9 kap. 100 §, PBL 10 kap. 9 §, PBL 10 kap. 18 §]
    tid_framat_dagar: 2

  - id: S2
    typ: fraga
    rubrik: Vad kräver lov?
    instruktion: Läs ansökan, situationsplanen och PM om dagvatten och markplanering.
    fragetyp: flersvar
    fraga: >
      Ansökan omfattar ett flerbostadshus, en parkering med nio platser och körbana, ett
      miljöhus med cykelförråd på 40 m² och en uppfyllnad av gården med 0,6 m. Vilka
      påståenden stämmer?
    alternativ:
      - text: Flerbostadshuset kräver bygglov för nybyggnad (9 kap. 3 §).
        ratt: true
      - text: Parkeringen kräver bygglov, eftersom den tillsammans med körbanan upptar mer än 50 m² inom detaljplan, och prövas i samma ärende (9 kap. 22 §).
        ratt: true
      - text: Miljöhuset kräver bygglov, eftersom en lovbefriad komplementbyggnad inom detaljplan får vara högst 30 m² (9 kap. 4 §).
        ratt: true
      - text: Uppfyllnaden av gården kräver ett separat marklov, eftersom höjdläget ändras med mer än 0,5 m.
      - text: Komplementbyggnader kan aldrig vara lovbefriade vid ett flerbostadshus.
      - text: Hissen kräver en separat anmälan enligt 6 kap. 1 § 4 PBF.
    forklaring: >
      Nybyggnad kräver bygglov (9 kap. 3 §), och parkeringsplatser större än 50 m² inom
      detaljplan också (22 §). Sedan 2025-12-01 kan en bygglovsbefriad komplementbyggnad
      byggas vid alla slags byggnader, inte bara vid en- och tvåbostadshus som friggeboden
      och attefallshuset före 2025-12-01. Men den får inom detaljplan vara högst 30 m² (4 §),
      så miljöhuset på 40 m² kräver lov. Fyllning som ändrar höjdläget mer än 0,5 m kräver
      marklov inom detaljplan (47 §), men inte när markåtgärden omfattas av ett bygglov
      (50 §), som här. Gårdens höjder och planbestämmelsen om genomsläpplig mark prövas alltså
      i bygglovet. Anmälan enligt 6 kap. 1 § PBF gäller bara åtgärder som inte kräver lov;
      hissen ingår i nybyggnaden och kontrolleras genom startbeskedet och kontrollplanen.
    lagrum: [PBL 9 kap. 3 §, PBL 9 kap. 4 §, PBL 9 kap. 22 §, PBL 9 kap. 47 §, PBL 9 kap. 50 §, PBF 6 kap. 1 §]
    tid_framat_dagar: 1

  - id: S3
    typ: berakning
    rubrik: Planenlighet i siffror
    instruktion: >
      Använd situationsplanen, fasaderna, ansökan, PM om dagvatten och planbestämmelserna.
      Avrunda till en decimal.
    fragor:
      - { id: byggnadsarea_procent, text: "Byggnadsarea i procent av fastighetsarean (huvudbyggnad och miljöhus)", svar: 27.8, tolerans: 1.5, enhet: "%" }
      - { id: byggnadshojd, text: "Byggnadshöjd enligt 1 kap. 3 § PBF (m)", svar: 12.8, tolerans: 0.1, enhet: m }
      - { id: vaningar, text: "Antal våningar enligt 1 kap. 4 § PBF", svar: 4, tolerans: 0 }
      - { id: balkong_prickmark, text: "Hur långt in över prickmarken kragar balkongerna mot Humlegatan ut (m)?", svar: 1.4, tolerans: 0.1, enhet: m }
      - { id: parkering, text: "Antal bilplatser enligt planbeskrivningens parkeringstal", svar: 9, tolerans: 0 }
      - { id: genomslapplig, text: "Andel genomsläpplig mark (%)", svar: 47.2, tolerans: 1, enhet: "%" }
    forklaring: >
      Byggnadsarean är 30 × 12 = 360 m² för huset och 10 × 4 = 40 m² för miljöhuset, 400 m²
      av tomtens 40 × 36 = 1 440 m², alltså 27,8 %. Planen tillåter 35 %; även om du räknar in
      de utkragande balkongerna ryms det. Byggnadshöjden räknas från den allmänna platsens
      medelnivå eftersom huset ligger mindre än sex meter från Humlegatan (1 kap. 3 § PBF):
      +37,0 − 24,2 = 12,8 m. Från marken hade det blivit 12,4 m, som fasadritningen visar.
      Planen tillåter 13,0 m. Huset har fyra våningar utan vind eller källare som räknas som
      våning (1 kap. 4 § PBF), och planen tillåter IV. Huset står precis i prickmarkens gräns,
      fyra meter från gatan, men balkongerna på plan 2–4 kragar ut 1,4 m över prickmarken. Det
      är planens enda avvikelse. Parkeringstalet 0,7 × 12 = 8,4 avrundas uppåt till 9 platser,
      och ansökan har 9. Hårdgjord yta är 760 m², så 680 m² eller 47,2 % är genomsläpplig;
      planen kräver minst 40 %.
    lagrum: [PBF 1 kap. 3 §, PBF 1 kap. 4 §, PBL 9 kap. 56 §, PBL 8 kap. 9 §]
    tid_framat_dagar: 1

  - id: S4
    typ: fraga
    rubrik: Balkongerna över prickmarken
    fragetyp: flerval
    fraga: Balkongerna mot Humlegatan kragar ut 1,4 m över prickmarken på plan 2–4. Hur ska det bedömas?
    alternativ:
      - text: >-
          Balkongerna avviker från planen, eftersom prickmarken gäller även utkragande delar.
          Avvikelsen kan godtas som liten och förenlig med planens syfte, men grannarna ska
          underrättas och få yttra sig först.
        ratt: true
      - text: Balkonger är inte byggnadsverk, så prickmarken gäller inte för dem.
      - text: Avvikelser kan inte godtas så länge planens genomförandetid pågår.
      - text: Vid nybyggnad godtas aldrig avvikelser, eftersom huset kan ritas om så att det följer planen.
    forklaring: >
      Mark som inte får förses med byggnadsverk omfattar också utrymmet ovanför marken, så
      balkonger som kragar ut över prickmarken avviker från planen. Lov kan ändå ges om
      avvikelsen är förenlig med planens syfte och liten (9 kap. 60 § 1). Prickmarken ska
      enligt planbeskrivningen ge förgårdsmark för träd och grönska mot gatan. Balkongerna
      sitter 3,4 m upp, är 1,4 m djupa, finns bara på två ställen per våning och hindrar inte
      planteringar på marken under. Avvikelsen medför ingen betydande miljöpåverkan och
      begränsar ingen rättighet (62 §), och inga tidigare avvikelser har godtagits (64 §).
      60 § kan tillämpas även under genomförandetiden; det är 61 § som kräver att den har gått
      ut. Vid nybyggnad finns större möjlighet att anpassa huset efter planen, och det vägs in
      i bedömningen, men det utesluter inte en liten avvikelse. Eftersom åtgärden avviker från
      planen ska grannarna underrättas (94 § första stycket 1).
    lagrum: [PBL 9 kap. 56 §, PBL 9 kap. 60 §, PBL 9 kap. 61 §, PBL 9 kap. 62 §, PBL 9 kap. 64 §, PBL 9 kap. 94 §]

  - id: S5
    typ: fraga
    rubrik: Buller från Humlegatan
    instruktion: Läs bullerutredningen och planbestämmelsen m1.
    fragetyp: flerval
    fraga: Humlegatan ger 63 dBA ekvivalent ljudnivå vid gatufasaden. Hur hanteras bullret i bygglovsprövningen?
    alternativ:
      - text: >-
          Planbestämmelsen m1 ska följas, och bullerutredningen visar att den gör det: i varje
          lägenhet vetter minst hälften av bostadsrummen mot gården, där 55 dBA inte
          överskrids, och den gemensamma uteplatsen klarar 50 och 70 dBA. Beslutet behöver
          inte innehålla bullervärden enligt 9 kap. 105 § andra stycket, men värdena bör
          redovisas i skälen.
        ratt: true
      - text: Beslutet måste innehålla beräknade bullervärden enligt 9 kap. 105 § andra stycket, annars är det felaktigt.
      - text: Lov kan inte ges, eftersom 60 dBA överskrids vid gatufasaden.
      - text: Buller prövas inte alls i bygglov inom detaljplan.
    forklaring: >
      Bostäder ska lokaliseras, placeras och utformas så att olägenheter från omgivningsbuller
      förebyggs (2 kap. 6 a § PBL). Inom detaljplan görs den bedömningen i planläggningen:
      planbeskrivningen redovisar bullervärdena (4 kap. 33 a §), och planen har en bestämmelse
      om skydd mot störningar (4 kap. 12 §). I bygglovet prövas att åtgärden inte strider mot
      den bestämmelsen (9 kap. 56 § första stycket 2). Kravet på att beslutet ska innehålla
      beräknade bullervärden i 9 kap. 105 § andra stycket gäller bara bostadsbyggnader
      utanför detaljplan. Att 60 dBA överskrids vid gatufasaden hindrar inte lov: enligt 4 §
      förordningen (2015:216) om trafikbuller vid bostadsbyggnader räcker det då att minst
      hälften av bostadsrummen vetter mot en sida där 55 dBA inte överskrids, och det är
      vad m1 kräver. Beräkningen ska ta hänsyn till framtida trafik (8 § samma förordning),
      och utredningen räknar med trafiken år 2040.
    lagrum: [PBL 2 kap. 6 a §, PBL 4 kap. 12 §, PBL 4 kap. 33 a §, PBL 9 kap. 56 §, PBL 9 kap. 105 §]

  - id: S6
    typ: fraga
    rubrik: Remisser
    fragetyp: flersvar
    fraga: Vilka ska få ansökan på remiss?
    alternativ:
      - text: Räddningstjänsten, om utrymning, insatsväg och brandvatten.
        ratt: true
      - text: Kommunens trafikenhet, om utfart, sikt, parkering och cykelparkering.
        ratt: true
      - text: Åkerslunda Vatten AB som VA-huvudman, om förbindelsepunkt och dagvatten.
        ratt: true
      - text: Trafikverket, eftersom huset ligger vid en trafikerad gata.
      - text: Länsstyrelsen, eftersom huset har fyra våningar.
      - text: Brf Getingen, eftersom föreningen äger huset mitt emot.
    forklaring: >
      Nämnden ska se till att ärendet blir utrett och kan begära yttranden från andra
      myndigheter och organ (23 och 26 §§ förvaltningslagen). Räddningstjänsten bedömer
      möjligheten att utrymma med höjdfordon och framkomligheten. Trafikenheten är
      väghållare för Humlegatan och bedömer utfarten och parkeringen mot 8 kap. 9 § PBL.
      VA-huvudmannen anger förbindelsepunkt och krav på dagvattenhantering. Humlegatan är en
      kommunal gata, så Trafikverket berörs inte, och länsstyrelsen har ingen roll när inga
      riksintressen eller strandskydd berörs. Grannar hörs inte genom remiss utan genom
      underrättelse enligt 9 kap. 94–96 §§.
    lagrum: [FL 23 §, FL 26 §, PBL 8 kap. 9 §]
    tid_framat_dagar: 3

  - id: S7
    typ: urval
    rubrik: Vilka ska underrättas?
    instruktion: >
      Balkongerna avviker från planen. Använd situationsplanen och plankartan och välj vilka
      som ska få underrättelsen.
    alternativ:
      - { text: "Humlan 2, väster (Ahmed och Sara Karimi)", ratt: true }
      - { text: "Humlan 4, öster (Åkerslunda Bostäder AB)", ratt: true }
      - { text: "Humlan 6, söder (Gunnar Holmberg)", ratt: true }
      - { text: "Getingen 2, norr om Humlegatan (Bostadsrättsföreningen Getingen)", ratt: true, kommentar: "Skiljs från Humlan 3 endast av gatan (9 kap. 96 § första stycket 1)." }
      - { text: "Åkerslunda 3:1, Humlegatan (Åkerslunda kommun)", ratt: true, kommentar: "Gatufastigheten gränsar till tomten; kommunen är ägare." }
      - { text: "Getingen 3, snett över gatan i nordost", ratt: false, kommentar: "Gränsar inte till Humlan 3 och ligger inte mitt emot den." }
      - { text: "Var och en av bostadsrättshavarna i Brf Getingen", ratt: false, kommentar: "Underrättelsen går till ägaren, föreningen. Bostadsrättshavare och hyresgäster underrättas inte längre." }
    forklaring: >
      Underrättelse krävs eftersom åtgärden avviker från detaljplanen (9 kap. 94 § första
      stycket 1). Meddelandet ska innehålla ansökans huvudsakliga innehåll, var den hålls
      tillgänglig och hur, till vem och när synpunkter kan lämnas (95 §). Det skickas till
      ägare och innehavare av särskild rätt till fastigheter som gränsar till Humlan 3 eller
      skiljs från den endast av en gata, och kungörs på kommunens anslagstavla (96 §).
      Underrättelsen skickas den 23 februari med svar senast den 9 mars.
    lagrum: [PBL 9 kap. 94 §, PBL 9 kap. 95 §, PBL 9 kap. 96 §]
    tid_framat_dagar: 14

  - id: S8
    typ: skrivelse
    rubrik: Kommunicera underlaget
    instruktion: >
      Remissvaren och grannyttrandet har kommit in. Skriv kommuniceringsbrevet till
      byggherren innan du beslutar.
    bedomningspunkter:
      - Riktas till Humlegården Bygg AB, som är både sökande och fastighetsägare
      - Räknar upp underlaget av betydelse som tillkommit, de tre remissvaren och yttrandet från Brf Getingen, och bifogar det
      - Berättar att nämnden avser att förena lovet med villkor om gatukostnader enligt 9 kap. 82 § och varför
      - Anger en bestämd tid för att yttra sig och att nämnden annars kan besluta på befintligt underlag
      - Skriver inte som om beslutet redan var fattat
      - Hänvisar till 9 kap. 98 § PBL
    modelltext: handlingar/modell-kommunicering.md
    forklaring: >
      Före beslut om lov ska sökanden och fastighetsägaren få ta del av allt underlag av
      betydelse och yttra sig inom en bestämd tid, om det inte är uppenbart obehövligt
      (9 kap. 98 § PBL). Ett villkor som påverkar när byggherren får börja bygga är sådant som
      byggherren ska få veta i förväg.
    lagrum: [PBL 9 kap. 98 §, FL 25 §]
    tid_framat_dagar: 11

  - id: S9
    typ: beslut
    rubrik: Fatta beslut
    instruktion: >
      Skriv beslutet. Tänk på avvikelsen, bullret, tomtkraven, villkoret om gatukostnader,
      upplysningarna i 9 kap. 105 § och vem som ska delges och vem som ska få meddelande.
    forvantat_beslut: bevilja_med_villkor
    godtagbara_utfall:
      - utfall: bevilja
        motivering: >-
          Villkoret enligt 9 kap. 82 § är en möjlighet, inte en skyldighet. Utan villkoret kan
          kommunen ändå kräva ersättningen när gatan är färdig (6 kap. 34 och 35 §§ PBL), men
          kommunen har då ingen säkerhet om betalningen.
    lagrum: [PBL 9 kap. 56 §, PBL 9 kap. 60 §]
    bedomningspunkter:
      - Beviljar bygglov för nybyggnad av flerbostadshus med 12 lägenheter, parkering och miljöhus med stöd av 9 kap. 56 § och, för balkongerna över prickmarken, 60 § PBL
      - Redovisar planenligheten med siffror, byggnadshöjd 12,8 m (13,0), fyra våningar (IV), byggnadsarea 27,8 % (35 %), genomsläpplig mark 47 % (40 %)
      - Motiverar varför balkongerna är en liten avvikelse förenlig med planens syfte, och konstaterar att 62 § inte hindrar
      - Redovisar bullervärdena och att planbestämmelsen m1 följs, utan att påstå att 9 kap. 105 § andra stycket gäller inom detaljplan
      - Prövar tomtkraven i 8 kap. 9 §, parkering, friyta för lek och utevistelse, tillgänglig parkering och angöring
      - Bestämmer med stöd av 9 kap. 82 § att byggnadsarbetena inte får påbörjas förrän fastighetsägaren betalat gatukostnadsersättningen eller ställt säkerhet för den
      - Bemöter Brf Getingens invändningar sakligt, och konstaterar att höjden och skuggningen följer av detaljplanen
      - Har upplysningarna i 105 §, giltighetstid, att byggbedömare inte används, kontrollansvarig Annika Vall, startbesked och tekniskt samråd (10 kap. 3 och 14 §§), att startbeskedet anger när arbetena får påbörjas med hänsyn till villkoret (10 kap. 24 § 6) och risken med att påbörja innan beslutet fått laga kraft
      - Avgiften 68 400 kr redovisas (107 §) och reduceras inte, eftersom beslutet fattas inom tio veckor från ansökningsdagen
      - Överklagandehänvisning med tre veckor från delgivningen och, för den som inte delges, från en vecka efter kungörelsen (13 kap. 16 §)
      - Delges Humlegården Bygg AB och Brf Getingen, som lämnat synpunkter som inte tillgodosetts (108 §); kungörs på anslagstavlan (109 §); meddelande till ägarna av Humlan 2, 4 och 6 och Åkerslunda 3:1 (110 §)
    modellbeslut: handlingar/modell-beslut.md

handelser:
  - id: E1
    namn: Remissvar och grannyttrande
    utlosare: { efter_steg: S7 }
    effekt:
      tid_framat_dagar: 3
      visa_handlingar: [H9, H10, H11, H12]
      meddelande: >
        Svarstiden för underrättelsen har gått ut. Räddningstjänsten, trafikenheten och
        Åkerslunda Vatten AB har svarat utan erinran men med upplysningar. Brf Getingen, som
        äger flerbostadshuset mitt emot på Humlegatan, motsätter sig bygget.
      nytt_steg:
        id: S7b
        typ: fraga
        rubrik: Ta ställning till Brf Getingens yttrande
        fragetyp: oppen
        fraga: >
          Föreningen anför skuggning, insyn från balkongerna, för få parkeringsplatser och mer
          trafik. Hur bedömer du varje invändning?
        bedomningspunkter:
          - Konstaterar att husets höjd och placering följer detaljplanen, och att skuggningen därför är en följd av planen och inte kan prövas på nytt i bygglovet
          - Bedömer insynen från balkongerna med hänsyn till avståndet (cirka 22 m mellan fasaderna, över en gata) och kommer fram till att den inte är en betydande olägenhet (2 kap. 9 §)
          - Konstaterar att antalet bilplatser följer planbeskrivningens parkeringstal och att tomten ska ha parkering i skälig utsträckning, med friyta i första hand (8 kap. 9 §)
          - Bedömer trafiken från nio platser som marginell och hänvisar till trafikenhetens yttrande
          - Noterar att föreningens synpunkter inte tillgodoses och att föreningen därför ska delges beslutet (9 kap. 108 §)
        modellsvar: >
          Huset håller sig inom planens byggnadshöjd, våningsantal och byggrätt. Att det
          skuggar Getingen 2 under delar av vinterhalvåret följer av planen, som prövade
          bebyggelsens höjd och placering, och den frågan kan inte prövas på nytt i bygglovet
          (13 kap. 2 § 7 PBL). Balkongerna är den enda avvikelsen. Avståndet mellan fasaderna är
          cirka 22 meter över en gata, vilket är normalt i en stadsmiljö, och insynen från sex
          balkonger är inte en betydande olägenhet (2 kap. 9 §). Parkeringen följer
          planbeskrivningens tal på 0,7 platser per lägenhet, och 8 kap. 9 § kräver parkering i
          skälig utsträckning, med friyta i första hand. Trafiken från nio platser är marginell
          på en gata med cirka 4 800 fordon per dygn, och trafikenheten har inga invändningar.
          Föreningens synpunkter tillgodoses inte, så föreningen ska delges beslutet (108 §).
        lagrum: [PBL 2 kap. 9 §, PBL 8 kap. 9 §, PBL 13 kap. 2 §, PBL 9 kap. 108 §]

  - id: E2
    namn: Brf Getingen överklagar
    utlosare: { efter_steg: S9, vid_beslut: bevilja }
    effekt:
      # Beslutet delges föreningen tre dagar efter beslutet; överklagandet kommer in
      # 19 dagar senare, 22 dagar efter beslutet (på huvudvägen en tisdag), inom tre veckor
      # från delgivningen.
      tid_framat_dagar: 22
      visa_handlingar: [H13]
      meddelande: >
        Brf Getingen delgavs beslutet den {{beslutsdatum+3}}. I dag har föreningens
        överklagande kommit in till nämnden. Du har konstaterat att det kommit in i rätt tid
        och överlämnat det till länsstyrelsen, som har förelagt nämnden att yttra sig inom
        tre veckor.
      nytt_steg:
        id: S10
        typ: skrivelse
        rubrik: Yttrande till länsstyrelsen
        instruktion: >
          Kontrollera först själv att överklagandet kommit in i rätt tid. Skriv sedan nämndens
          yttrande. Ta ställning till vad nämnden yrkar och bemöt varje grund föreningen anför.
        bedomningspunkter:
          - "Konstaterar att överklagandet kommit in i rätt tid: föreningen delgavs den {{beslutsdatum+3}} och tiden gick ut den {{beslutsdatum+24|vardag}} (44 och 45 §§ förvaltningslagen)"
          - Anger att nämnden vidhåller beslutet och anser att överklagandet ska avslås
          - Bemöter grunden om höjd och skuggning, en fråga som är avgjord i detaljplanen och som inte kan prövas (13 kap. 2 § 7 PBL)
          - Bemöter grunden om att avvikelsen inte är liten, med syftet med prickmarken och balkongernas läge och storlek, och förklarar varför MÖD 2018:4 om byggnadsarea inte är jämförbar
          - Bemöter grunderna om parkering och trafik med 8 kap. 9 § och trafikenhetens yttrande
          - Redovisar handläggningen kort med datum, underrättelse, kommunicering och delgivning, och hänvisar till handlingarna
          - Tar inte ställning till föreningens klagorätt som om nämnden avgjorde den; det gör länsstyrelsen
        modelltext: handlingar/modell-yttrande.md
        lagrum: [PBL 13 kap. 3 §, PBL 13 kap. 2 §, PBL 9 kap. 60 §, FL 44 §, FL 45 §, FL 46 §]

  - id: E3
    namn: Länsstyrelsens beslut
    utlosare: { efter_steg: S10 }
    effekt:
      tid_framat_dagar: 72 # H14 är daterat två dagar före; på huvudvägen en tisdag
      visa_handlingar: [H14]
      meddelande: >
        Länsstyrelsens beslut har kommit in. Länsstyrelsen avvisar överklagandet i den del det
        gäller husets höjd och skuggningen och avslår det i övrigt. Brf Getingens ordförande
        ringer och frågar om det går att gå vidare.
      nytt_steg:
        id: S11
        typ: fraga
        rubrik: Kan länsstyrelsens beslut överklagas?
        fragetyp: flersvar
        fraga: Vilka påståenden om länsstyrelsens beslut stämmer?
        alternativ:
          - text: Brf Getingen kan överklaga beslutet till mark- och miljödomstolen, eftersom det har gått föreningen emot.
            ratt: true
          - text: Överklagandet ska skickas till länsstyrelsen och ha kommit in inom tre veckor från den dag föreningen fick del av beslutet.
            ratt: true
          - text: Föreningen kan också överklaga avvisningen, men domstolen prövar då bara om länsstyrelsen gjorde rätt som avvisade den delen.
            ratt: true
          - text: Humlegården Bygg AB kan överklaga för att få lovet bekräftat i domstol.
          - text: Bygg- och miljönämnden kan överklaga, eftersom nämnden är part i ärendet.
          - text: Länsstyrelsen är sista instans i ärenden om bygglov.
          - text: Föreningen kan överklaga direkt till Mark- och miljööverdomstolen.
        forklaring: >
          Länsstyrelsens beslut enligt PBL får överklagas till mark- och miljödomstolen
          (13 kap. 6 § PBL). Den som beslutet angår får överklaga om det har gått honom eller
          henne emot (13 kap. 8 § PBL och 42 § förvaltningslagen), alltså föreningen, inte
          byggherren eller nämnden, vars beslut står fast. Överklagandet ges in till
          länsstyrelsen inom tre veckor från den dag föreningen fick del av beslutet (43 och
          44 §§ förvaltningslagen). I domstolen blir nämnden föreningens motpart (5 kap. 2 §
          lagen (2010:921) om mark- och miljödomstolar). Mark- och miljödomstolens avgörande
          kan i sin tur överklagas till Mark- och miljööverdomstolen, som kräver
          prövningstillstånd, och dess avgörande får som huvudregel inte överklagas (5 kap. 5 §
          samma lag). Lovet gäller omedelbart (9 kap. 114 § PBL), så byggherren kan börja bygga
          efter startbesked, men på egen risk så länge beslutet inte fått laga kraft (105 § 5).
        lagrum: [PBL 13 kap. 6 §, PBL 13 kap. 8 §, FL 42 §, FL 43 §, FL 44 §, PBL 9 kap. 114 §]

facit:
  sammanfattning: >
    Huset följer planen i höjd, våningar, byggnadsarea, buller och genomsläpplighet. Den enda
    avvikelsen, balkonger som kragar ut 1,4 m över prickmarken mot gatan, är liten och förenlig
    med planens syfte (9 kap. 60 § 1). Grannarna underrättas och Brf Getingen invänder.
    Efter remisser och kommunicering ges lov med villkor om gatukostnader (82 §), med
    upplysningar enligt 105 §, delgivning av byggherren och föreningen, kungörelse och
    meddelande till övriga grannar. Föreningen överklagar i rätt tid, nämnden yttrar sig och
    länsstyrelsen avvisar delen om höjden och avslår i övrigt. Föreningen kan gå vidare till
    mark- och miljödomstolen.
  vanliga_fel:
    - Att räkna byggnadshöjden från marken invid huset i stället för från gatans medelnivå när huset ligger mindre än sex meter från allmän plats (1 kap. 3 § PBF)
    - Att missa att prickmarken gäller även utkragande balkonger, eller att godta avvikelsen utan att underrätta grannarna
    - Att kräva bullervärden i beslutet med stöd av 9 kap. 105 § andra stycket, som bara gäller utanför detaljplan, i stället för att pröva planbestämmelsen m1
    - Att kräva separat marklov för gårdens uppfyllnad, trots att markåtgärden ingår i bygglovet (9 kap. 50 §)
    - Att pröva skuggningen på nytt trots att höjden följer planen
    - Att glömma att den granne som lämnat synpunkter som inte tillgodosetts ska delges, inte bara få meddelande (9 kap. 108 §)
    - Att tro att nämnden eller byggherren kan överklaga länsstyrelsens beslut, eller att länsstyrelsen är sista instans
  modellbeslut: handlingar/modell-beslut.md
