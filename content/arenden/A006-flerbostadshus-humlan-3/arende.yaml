# Nivå 3-ärende. Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan.
# Lagrum i 9 kap. PBL är kontrollerade mot docs/rattslage/pbl-9-kap.txt (lydelse 2025:974,
# 105 § i lydelse 2026:712). PBL 1, 2, 4, 6, 8, 10, 12 och 13 kap., PBF 1 och 6 kap., FL,
# lagen (2010:921) om mark- och miljödomstolar och förordningen (2015:216) om trafikbuller
# vid bostadsbyggnader är kontrollerade mot utdragen i docs/rattslage/ (riksdagen.se,
# hämtade 2026-11-04–05). PBL 6 kap. hämtades 2026-11-05 och sparades som pbl-6-kap.txt.
# Ärendet utspelar sig under 2026, före 2027-01-01, så 9 kap. 56 § och 8 kap. gäller i
# nuvarande lydelse.
# Koordinater: situationsplanen och typplanen använder samma system, origo i tomtens
# nordvästra hörn. Sett från Humlegatan (norr) ligger öster till vänster, så fasaden mot
# norr har x = 35 − (situationsplanens x + bredd); fasaden mot söder har x = situationsplanens x − 5.
# Marknivå invid huset +24,6, Humlegatans medelnivå invid tomten +24,2, takets och
# takfotens överkant +37,0. Fasadritningen mäter från marken (12,4 m).
id: A006
titel: Flerbostadshus på Humlan 3
niva: 3
status: utkast
rattslage: "2025-12-01"
fastighet: Humlan 3, Åkerslunda kommun
sammanfattning: >
  En byggherre vill bygga ett flerbostadshus i fyra våningar med tolv lägenheter på en
  obebyggd tomt vid Humlegatan. Detaljplanen från 2019 reglerar höjd, våningsantal,
  byggnadsarea, prickmark mot gatan, buller och markens genomsläpplighet. Balkongerna mot
  gatan kragar ut över prickmarken. Ärendet kräver planenlighetsprövning med beräkningar,
  remisser, underrättelse av grannar, kommunicering och ett beslut med villkor om
  gatukostnader. En bostadsrättsförening mitt emot överklagar, och länsstyrelsen avgör saken.
startdatum: 2026-02-16
moduler: [04-detaljplan, 08-ritning-berakning, 06-handlaggning, 07-krav-byggnadsverk, 12-overklagande, 09-genomforande]
larandemal:
  - Pröva planenligheten i flera delar och räkna ut byggnadshöjd (1 kap. 3 § PBF), våningsantal, byggnadsarea, intrång på prickmark och parkeringsbehov
  - Bedöma om balkonger över prickmark är en liten avvikelse förenlig med planens syfte (9 kap. 56 och 60 §§) och vad det kräver av handläggningen (94 §)
  - Förstå hur buller prövas inom detaljplan (planbestämmelse, 2 kap. 6 a §, 4 kap. 33 a §) och när beslutet måste innehålla bullervärden (9 kap. 105 § andra stycket)
  - Pröva tomtkraven i 8 kap. 9 §, parkering, friyta och tillgänglighet, och se att marklov inte behövs när markåtgärden ingår i bygglovet (9 kap. 50 §)
  - Skicka remisser, underrätta grannar (94–96 §§) och kommunicera underlaget (98 §)
  - Besluta om villkor enligt 9 kap. 82 § och upplysa om kontrollansvarig, tekniskt samråd och startbesked (10 kap.)
  - Expediera och kungöra rätt (108–110 §§), skriva nämndens yttrande över ett överklagande och förstå hur prövningskedjan fortsätter efter länsstyrelsen (13 kap.)

parter:
  sokande: [Humlegården Bygg AB, Johan Berglund]
  fastighetsagare: [Humlegården Bygg AB]
  grannar:
    - { fastighet: Humlan 2, namn: [Ahmed Karimi, Sara Karimi] }
    - { fastighet: Humlan 4, namn: [Åkerslunda Bostäder AB] }
    - { fastighet: Humlan 6, namn: [Gunnar Holmberg] }
    - { fastighet: Getingen 2, namn: [Bostadsrättsföreningen Getingen, Brf Getingen] }
    - { fastighet: Åkerslunda 3:1, namn: [Åkerslunda kommun] }

