# Nivå 3-ärende. Fiktiv fastighet, fiktiv kommun, fiktiv översiktsplan och fiktiv fornlämning.
# Lagrum i 9 kap. PBL är kontrollerade mot docs/rattslage/pbl-9-kap.txt (lydelse 2025:974).
# PBL 1–5, 8, 12 och 13 kap., FL, MB 3 och 7 kap., förordningen (1998:899) om miljöfarlig
# verksamhet och hälsoskydd och kulturmiljölagen 2 kap. är kontrollerade mot utdragen i
# docs/rattslage/ (hämtade från riksdagen.se 2026-11-04–05).
# Ärendet är ett förhandsbesked: 9 kap. 41, 42 och 74 §§ (bara utanför detaljplan, bara
# lokalisering, bindande två år från laga kraft) och 104 § om beslutets innehåll. 105 och
# 114 §§ gäller lov, inte förhandsbesked.
# Datum efter beslutet skrivs som mallvariabler ({{beslutsdatum}} …, se content/README.md).
#
# Situationsplanerna (1:500) använder tomter (nya tomtgränser med area), nybyggnader (huset på
# tomt 2), fornlamningar och namngivna grannhus (kvarnen och mjölnarbostaden). I H8 ligger
# fornlämningsområdet utanför ritningens tomt; generatorn ritar det ändå och måttsätter de
# 10 m från den östra gränsen.
id: A009
titel: Förhandsbesked för två tomter vid Kvarnbacken
lovtyp: forhandsbesked
niva: 3
status: utkast
rattslage: "2025-12-01"
fastighet: Kvarnbacken 1:7, Åkerslunda kommun
sammanfattning: >
  Ägarna till Kvarnbacken 1:7 vill stycka av två tomter för enbostadshus vid Kvarnvägen och
  söker förhandsbesked innan de går till Lantmäteriet. Marken ligger utanför detaljplan men
  inom den sammanhållna bebyggelsen i Kvarnbacken, intill en kvarnmiljö som översiktsplanen
  pekar ut som särskilt värdefullt bebyggelseområde. En stensättning från järnåldern ligger
  på den östra tomtens mark, avloppet blir enskilt och utfarten går mot en enskild väg som
  ägs av en samfällighet. Länsstyrelsen kräver arkeologisk utredning om tomten inte
  justeras, miljöenheten godtar avloppet med villkor och efter beslutet överklagar en granne.
startdatum: 2026-09-07
moduler: [05-utanfor-plan, 11-angransande, 06-handlaggning, 12-overklagande, 02-pbl-systemet]
larandemal:
  - Förstå förhandsbeskedets räckvidd efter 2025-12-01, bara utanför detaljplan, bara lokalisering och bindande vid bygglovsprövningen om bygglov söks inom två år från laga kraft (9 kap. 41, 42 och 74 §§)
  - Göra en lokaliseringsprövning enligt 9 kap. 74 § och 2 kap. 2, 4, 5, 6, 6 a, 9 och 10 §§ PBL och avgöra om två nya tomter kräver detaljplan (4 kap. 2 §)
  - Väga in ett särskilt värdefullt bebyggelseområde (8 kap. 13 § andra stycket 4, utpekat i översiktsplanen enligt 3 kap. 5 § 4) i lokaliseringsprövningen genom 2 kap. 6 § tredje stycket
  - Hantera en fornlämning enligt kulturmiljölagen, samråd och arkeologisk utredning (2 kap. 10 och 11 §§) och tillstånd till ingrepp (2 kap. 12 §), och upplysa om det (9 kap. 92 §)
  - Underrätta grannar och en samfällighet utanför plan (9 kap. 94–96 och 113 §§, 5 kap. 33 §) och skicka remisser till länsstyrelsen och miljöenheten
  - Hantera en ändrad ansökan efter underrättelsen och räkna tidsfrist och avgift (9 kap. 94 § tredje stycket, 99 och 100 §§, 12 kap. 8 a §)
  - Skriva ett positivt förhandsbesked med villkor och upplysningar enligt 9 kap. 104 §, avgift (107 §) och rätt expediering (108–110 §§)
  - Rättidspröva en grannes överklagande av ett positivt förhandsbesked (13 kap. 16 § PBL, 44–47 §§ FL)

