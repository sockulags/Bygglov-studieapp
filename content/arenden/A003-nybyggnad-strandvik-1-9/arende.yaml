# Nivå 3-ärende. Fiktiv fastighet, fiktiv kommun, fiktiv översiktsplan.
# Lagrum i 9 kap. PBL är kontrollerade mot docs/rattslage/pbl-9-kap.txt (lydelse 2025:974,
# 105 § i lydelse 2026:712). PBL 2, 3, 4, 10, 12 och 13 kap., FL, MB 7, 16 och 19 kap.,
# väglagen, förordningen (1998:899) om miljöfarlig verksamhet och hälsoskydd och
# trafikbullerförordningen (2015:216) är kontrollerade mot riksdagen.se (hämtade 2026-11-04).
# 12 kap. 8 a § PBL och 2 § lagen (1930:173) om beräkning av lagstadgad tid är kontrollerade
# mot riksdagen.se 2026-11-05.
# Ärendet utspelar sig efter 2026-07-01 så att 9 kap. 105 § i nu gällande lydelse gäller.
# Datum efter beslutet skrivs som mallvariabler ({{beslutsdatum}}, {{kungorelsedatum+19}} …,
# se content/README.md), så att de stämmer oavsett vilken dag beslutet fattas.
id: A003
titel: Nybyggnad av enbostadshus utanför detaljplan nära strand
niva: 3
status: utkast
rattslage: "2025-12-01"
fastighet: Strandvik 1:9, Åkerslunda kommun
sammanfattning: >
  Sökandena vill bygga ett enbostadshus på en tidigare bebyggd fritidshustomt vid Långsjön.
  Fastigheten ligger utanför detaljplan och utanför sammanhållen bebyggelse. Huset och en del
  av tomten hamnar inom strandskyddat område, den nya utfarten ska anslutas till en allmän väg
  och avloppet blir enskilt. Ärendet kräver lokaliseringsprövning, remisser, vilande i väntan
  på strandskyddsdispens, underrättelse av grannar och kommunicering. Efter beslutet
  överklagar en granne.
startdatum: 2026-08-17
moduler: [05-utanfor-plan, 06-handlaggning, 11-angransande, 12-overklagande, 02-pbl-systemet]
larandemal:
  - Göra en lokaliseringsprövning enligt 9 kap. 57 § och 2 kap. 2, 4, 5, 6 och 9 §§ PBL, och pröva om detaljplan krävs (4 kap. 2 §)
  - Se vilka andra tillstånd som behövs och vilka som ska få remiss (strandskyddsdispens, avlopp, anslutning till allmän väg)
  - Låta ärendet vila i väntan på strandskyddsdispens (9 kap. 102 §) och förstå följden för avgiften (12 kap. 8 a §)
  - Underrätta grannar utanför plan (9 kap. 94–96 §§) och hantera en ändrad ansökan efter underrättelsen
  - Kommunicera underlaget med sökanden och fastighetsägaren (9 kap. 98 §)
  - Skriva ett beslut med upplysningar enligt 9 kap. 105 §, kungöra det (109 §) och expediera rätt (108 och 110 §§)
  - Rättidspröva ett överklagande (13 kap. 16 § PBL, 44–46 §§ FL) och skriva nämndens yttrande till länsstyrelsen

