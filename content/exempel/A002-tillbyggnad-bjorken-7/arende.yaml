# Exempel på ärendeformat. Fiktiv fastighet, fiktiv kommun, fiktiv detaljplan.
id: A002
titel: Tillbyggnad av enbostadshus
niva: 2
status: utkast
rattslage: "2025-12-01"
lagrum_osaker: true   # paragrafnummer i 9 kap skrivna före omskrivningen 2025-12-01, kontrolleras mot Lagtextens byggregler
fastighet: Björken 7, Åkerslunda kommun
sammanfattning: >
  Sökanden vill bygga till sitt enbostadshus med 38 kvm åt söder. Fastigheten ligger inom
  detaljplan från 1978. Tillbyggnaden hamnar delvis på prickmark och byggnadshöjden blir
  något högre än planen tillåter. Ansökan är inte komplett vid ankomst.
startdatum: 2026-03-02
larandemal:
  - Granska fullständighet och skriva föreläggande om komplettering
  - Läsa planbestämmelser och mäta byggnadshöjd och byggnadsarea
  - Bedöma liten avvikelse enligt 9 kap. 31 b § PBL
  - Avgöra vilka grannar som ska höras
  - Skriva ett beslut med motivering, lagstöd och överklagandehänvisning

taxa:
  bygglov_tillbyggnad_16_49kvm: 9800
  reduktion_per_vecka: 0.2

handlingar:
  - id: H1
    typ: ansokan
    titel: Ansökan om bygglov
    fil: handlingar/ansokan.pdf
    inkom: 2026-03-02
  - id: H2
    typ: situationsplan
    titel: Situationsplan 1:500
    fil: handlingar/situationsplan.svg
    inkom: 2026-03-02
    parametrar: { tomt_bredd: 24, tomt_djup: 32, hus: [6, 10, 10, 8], tillbyggnad: [6, 18, 7, 5.5], prickmark_sydlig_zon: 6 }
  - id: H3
    typ: fasadritning
    titel: Fasader mot söder och öster 1:100
    fil: handlingar/fasader.svg
    inkom: 2026-03-02
    parametrar: { byggnadshojd: 4.9, takvinkel: 27 }
  - id: H4
    typ: planbestammelser
    titel: Detaljplan Dp 1978-14, plankarta med bestämmelser
    fil: handlingar/plan.pdf
    inkom: 2026-03-02
    fakta: { hogsta_byggnadshojd: 4.5, storsta_byggnadsarea_procent: 20, prickmark: "mark som inte får bebyggas, 6 m från södra gränsen" }
  - id: H5
    typ: planritning
    titel: Planritning 1:100
    fil: handlingar/planritning.svg
    inkom: 2026-03-16        # kommer först efter komplettering, se händelse E1
    dold_tills: E1
  - id: H6
    typ: anmalan_ka
    titel: Anmälan om kontrollansvarig
    fil: handlingar/ka.pdf
    inkom: 2026-03-16
    dold_tills: E1
  - id: H7
    typ: grannyttrande
    titel: Yttrande från ägaren till Björken 8
    fil: handlingar/yttrande-bjorken-8.pdf
    dold_tills: E2

steg:
  - id: S1
    typ: checklista
    rubrik: Är ansökan komplett?
    instruktion: Gå igenom handlingarna och markera vad som saknas för att ärendet ska kunna prövas.
    poster:
      - { text: Ifylld och undertecknad ansökan, finns: true }
      - { text: Situationsplan, finns: true }
      - { text: Fasadritningar, finns: true }
      - { text: Planritning, finns: false }
      - { text: Sektionsritning, finns: false }
      - { text: Anmälan om kontrollansvarig, finns: false }
      - { text: Förslag till kontrollplan, finns: false, kommentar: "Krävs först till tekniskt samråd, inte för lovprövningen" }
    forklaring: >
      Planritning, sektion och kontrollansvarig saknas. Enligt 9 kap. 22 § PBL ska nämnden
      förelägga sökanden att avhjälpa bristerna inom viss tid. Handläggningstiden enligt
      9 kap. 27 § börjar löpa först när ansökan är komplett.
    lagrum: [PBL 9 kap. 21 §, PBL 9 kap. 22 §, PBL 9 kap. 27 §]

  - id: S2
    typ: skrivelse
    rubrik: Skriv föreläggande om komplettering
    instruktion: Skriv ett kort föreläggande till sökanden. Ange vad som saknas, tidsfrist och konsekvens.
    bedomningspunkter:
      - Räknar upp de saknade handlingarna konkret
      - Anger en rimlig tidsfrist (t.ex. tre veckor)
      - Upplyser om att ansökan kan komma att avvisas om komplettering uteblir (9 kap. 22 §)
      - Upplyser om att handläggningstiden räknas från komplett ansökan
      - Begriplig ton, inte hotfull, inte svävande
    modelltext: handlingar/modell-forelaggande.md

  - id: S3
    typ: berakning
    rubrik: Mät och beräkna
    instruktion: Använd ritningarna och planbestämmelserna.
    fragor:
      - { id: byggnadsarea_efter, text: "Total byggnadsarea efter tillbyggnad (kvm)", svar: 138, tolerans: 3 }
      - { id: byggnadsarea_procent, text: "Andel av tomtarean (%)", svar: 18, tolerans: 1 }
      - { id: byggnadshojd, text: "Tillbyggnadens byggnadshöjd (m)", svar: 4.9, tolerans: 0.1 }
      - { id: prickmark_kvm, text: "Hur många kvm av tillbyggnaden hamnar på prickmark?", svar: 3.5, tolerans: 1 }
    forklaring: >
      Byggnadsarean ryms inom 20 %. Byggnadshöjden överskrider planens 4,5 m med 0,4 m och en
      mindre del hamnar på prickmark. Två avvikelser ska bedömas, både var för sig och
      tillsammans.

  - id: S4
    typ: fraga
    rubrik: Är avvikelserna liten avvikelse?
    fragetyp: flerval
    fraga: Hur bör avvikelserna bedömas enligt 9 kap. 31 b § PBL?
    alternativ:
      - text: Båda är små och förenliga med planens syfte; lov kan ges efter grannehörande.
        ratt: true
      - text: Höjdavvikelsen är liten men prickmarksintrånget kan aldrig godtas.
      - text: Avvikelserna är för stora; ansökan ska avslås direkt.
      - text: Avvikelser kan inte godtas i planer äldre än 1987.
    forklaring: >
      Praxis godtar ofta mindre höjdöverskridanden och begränsade intrång på prickmark om
      syftet med bestämmelsen inte motverkas (här: avstånd till gata och grannar). Den samlade
      bedömningen avgör. Eftersom lovet avviker från planen ska berörda grannar höras enligt
      9 kap. 25 §. Observera att detta är en bedömningsfråga; handledaren kan ha synpunkter.
    lagrum: [PBL 9 kap. 31 b §, PBL 9 kap. 25 §]

  - id: S5
    typ: urval
    rubrik: Vilka ska höras?
    instruktion: Välj de sakägare som ska ges tillfälle att yttra sig.
    alternativ:
      - { text: Björken 6 (väster), ratt: true }
      - { text: Björken 8 (öster), ratt: true }
      - { text: Björken 12 (söder, över gatan), ratt: true, kommentar: Berörs av höjd och placering mot gatan }
      - { text: Åkerslunda 1:1 (kommunens gata), ratt: true, kommentar: Kommunen som fastighetsägare }
      - { text: Björken 3 (två tomter bort), ratt: false }
    forklaring: Kända sakägare och boende som berörs ska underrättas enligt 9 kap. 25 § PBL. Hörandet tar i simuleringen två veckor.
    tid_framat_dagar: 14

  - id: S6
    typ: beslut
    rubrik: Fatta beslut
    forvantat_beslut: bevilja
    bedomningspunkter:
      - Beslut om att bevilja bygglov med stöd av 9 kap. 31 b § PBL
      - Motiverar varför avvikelserna är små och förenliga med planens syfte
      - Bemöter grannens yttrande (H7) sakligt
      - Upplyser om att åtgärden inte får påbörjas utan startbesked (10 kap. 3 §)
      - Upplyser om giltighetstid (9 kap. 43 §) och kungörelse (9 kap. 41 a §)
      - Avgift angiven enligt taxan, med eventuell reduktion om tiden överskridits
      - Överklagandehänvisning finns
      - Beslutet delges Björken 8 som yttrat sig negativt (9 kap. 41 §)
    modellbeslut: handlingar/modell-beslut.md

handelser:
  - id: E1
    namn: Komplettering inkommer
    utlosare: { efter_steg: S2 }
    effekt:
      visa_handlingar: [H5, H6]
      tid_framat_dagar: 14
      meddelande: Sökanden har kompletterat ärendet. Ansökan är nu komplett. Handläggningstiden börjar löpa.
      satt_komplett_datum: true

  - id: E2
    namn: Grannyttrande
    utlosare: { efter_steg: S5 }
    effekt:
      visa_handlingar: [H7]
      meddelande: Ägaren till Björken 8 har yttrat sig och motsätter sig tillbyggnaden med hänvisning till skuggning.
      nytt_steg:
        id: S5b
        typ: fraga
        rubrik: Ta ställning till yttrandet
        fragetyp: oppen
        fraga: Grannen anför skuggning. Hur värderar du invändningen i förhållande till 2 kap. 9 § PBL?
        bedomningspunkter:
          - Skiljer på betydande olägenhet och ett allmänt försämrat läge
          - Resonerar om väderstreck, avstånd och tillbyggnadens höjd
          - Noterar att invändningen ska bemötas i beslutet

  - id: E3
    namn: Beviljat utan grannehörande
    utlosare: { vid_beslut: bevilja, om_missat: S5 }
    effekt:
      meddelande: >
        Beslutet överklagas av ägaren till Björken 8, som aldrig gavs tillfälle att yttra sig.
        Länsstyrelsen upphäver beslutet på grund av handläggningsfel och återförvisar ärendet.
      nytt_steg:
        id: S7
        typ: fraga
        rubrik: Vad gick fel?
        fragetyp: oppen
        fraga: Förklara vilket fel nämnden gjorde och vilket lagrum som åsidosattes.
        bedomningspunkter:
          - Identifierar att avvikelse från plan kräver grannehörande (9 kap. 25 §)
          - Förstår att felet är ett handläggningsfel som leder till upphävande

  - id: E4
    namn: Byggstart före startbesked
    utlosare: { vid_beslut: bevilja, slump: 0.3 }
    effekt:
      tid_framat_dagar: 21
      meddelande: En granne ringer och berättar att grävning påbörjats. Något tekniskt samråd har inte hållits.
      nytt_steg:
        id: S8
        typ: fraga
        rubrik: Tillsyn
        fragetyp: flerval
        fraga: Vad ska nämnden göra?
        alternativ:
          - { text: "Inget, lovet är beviljat.", ratt: false }
          - { text: "Ta ut byggsanktionsavgift för påbörjande utan startbesked och vid behov förbjuda fortsatt arbete.", ratt: true }
          - { text: "Återkalla bygglovet.", ratt: false }
        forklaring: Påbörjande utan startbesked är sanktionerat i 11 kap. 51 § PBL och 9 kap. PBF. Nämnden kan också meddela förbud enligt 11 kap. 30–31 §§.
        lagrum: [PBL 11 kap. 51 §, PBF 9 kap. 6 §, PBL 11 kap. 30 §]
